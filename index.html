      c("Hyundai Veloster N TCR", "tcr", 2019, "L", "El automovilismo de turismos sigue siendo una de las formas más populares de competencia en circuito del mundo, combinando carros accesibles de tracción delantera con algunos de los trazados más legendarios del planeta. El resultado es una modalidad agresiva, a codazos, tan divertida para quien maneja como para quien la ve. Lanzado en 2019, el Hyundai Veloster N TC fue construido para los equipos norteamericanos de Hyundai, con el fin de reflejar mejor la presencia de la marca en ese mercado. Basado en el Hyundai i30 N TC que dio inicio al dominio moderno de la marca en la disciplina, el Veloster comparte la mayoría de sus componentes con su antecesor, y rápidamente compartió también éxitos similares en pista. En 2019, su primera temporada como parte del IMSA Michelin Pilot Challenge, los Veloster del prominente equipo Bryan Herta Autosport hicieron el 1-2 en la tabla final con cuatro victorias combinadas."),
      c("Stock Car Brasil (Cruze / Corolla)", "supercars", 2023, "L", "Fundada en 1979, la Stock Car Brasil es la división de turismos más importante del país. Con carros compactos impulsados por motores V8 de 550 caballos pero construidos pensando en costos razonables, la fórmula ha resultado atractiva por mucho tiempo para pilotos de clase mundial, ya sea que regresen a su país natal o que se sumen a la serie desde el extranjero. El calendario, enfocado en circuitos ruteros, está encabezado por visitas anuales al Autódromo José Carlos Pace (Interlagos), casa histórica del Gran Premio de Brasil. Chevrolet ha sido el único fabricante en competir en la Stock Car Brasil desde su origen, rotando entre varios modelos antes de asentarse en el Cruze en 2016. El Cruze consiguió su primer campeonato en 2017 con Daniel Serra, quien logró tres títulos al hilo antes de ceder ante Ricardo Maurício en 2020 y Gabriel Casagrande en 2021.", { w: "gt3" }),
      c("Ford Mustang GT Supercar (Gen3)", "supercars", 2023, "S", "Supercars ha sido la principal serie de turismos de Australia desde mediados de los años 90, reuniendo una afición mundial apasionada y devota a lo largo de décadas de carreras cerradas y emocionantes. El reglamento Gen 3 de Supercars se anunció por primera vez en 2020 antes de debutar a tiempo para la temporada 2023. El nuevo conjunto de reglas fue una hoja completamente en blanco para la serie, pensado para recortar costos, aumentar la relevancia de calle para los fabricantes y generar carreras más cerradas con carros más difíciles de manejar. El emblemático Mustang de Ford se convirtió en su modelo elegido para Supercars en 2019, y su uso continuó en el reglamento Gen 3. El flamante Mustang Gen 3 ganó la primera carrera de la nueva era en Newcastle con Cameron Waters en 2023, y cerró esa temporada con cuatro victorias al hilo en Surfers Paradise y Adelaida.", { notas: ["La palanca secuencial es parte de la experiencia Supercars: cambia con fuerza."] }),
      c("Chevrolet Camaro Supercar (Gen3)", "supercars", 2023, "S", "Supercars ha sido la principal serie de turismos de Australia desde mediados de los años 90, reuniendo una afición mundial apasionada y devota a lo largo de décadas de carreras cerradas y emocionantes. El reglamento Gen 3 se anunció por primera vez en 2020 antes de debutar a tiempo para la temporada 2023, y fue una hoja completamente en blanco para la serie, pensada para recortar costos, aumentar la relevancia de calle para los fabricantes y generar carreras más cerradas. Con la desaparición progresiva de la marca Holden en Australia, General Motors optó por reemplazar al veterano Commodore con el Chevrolet Camaro ZL1 como su modelo insignia de la Gen 3. Marcó la primera vez que Chevrolet competía en la era Supercars, pero el cambio rindió frutos rápidamente cuando Shane van Gisbergen le dio al carro su primera victoria en su segunda carrera en Newcastle. Ese triunfo inició una racha de 15 victorias camino al primer título de fabricantes de Chevrolet en Supercars."),
      c("Supercars Holden ZB Commodore (Gen2)", "supercars", 2018, "S", "El Holden Commodore ZB continúa la larga y célebre historia de Holden como una de las marcas más prominentes de Supercars. El ZB debutó en la temporada 2018, reemplazando al popular VF y encontrando de inmediato el círculo de ganadores en su primera carrera con Shane van Gisbergen. El ZB amplió significativamente la ventaja de Holden en el récord de más victorias en la historia de Supercars, una cifra que superaba con creces las 500 al final de la temporada 2019, y fue competido por sus dos equipos más ganadores de todos los tiempos, Triple Eight Race Engineering y Walkinshaw Andretti United. Impulsados por un motor de 5.0 litros, los Supercars pueden producir más de 635 caballos. Aceleran de 0 a 100 km/h en 3.2 segundos y alcanzan una velocidad máxima de casi 300 km/h. La principal categoría australiana anunció su especificación Gen2 en diciembre de 2014 y la adoptó a tiempo para la temporada 2018 tras tres años de desarrollo."),
      c("V8 Supercar Ford Falcon FG / Holden VF Commodore (Legacy)", "supercars", 2014, "S", "Basado en el concepto de \"nueva generación\" desarrollado por la leyenda del V8 Supercar Mark Skaife, el Ford Falcon FG II debutó en 2013, sumando nueve victorias y llevando a Will Davison y Mark Winterbottom al tercer y cuarto puesto de la tabla general del campeonato V8 Supercar. El Ford Falcon FG II viene equipado con un motor V8 atmosférico de 5.0 litros que entrega más de 635 caballos a través de un transeje secuencial de seis velocidades. Aunque las dimensiones de su chasis son, por reglamento, idénticas a las de las otras marcas de la serie, los Falcon FG II son construidos por distintos fabricantes acreditados. Competido por equipos como Ford Performance Group y Dick Johnson Racing, el Falcon fue el vehículo elegido por el legendario equipo estadounidense Penske Racing para su incursión en la serie V8 Supercar."),
      c("SCCA Spec Racer Ford Gen3", "calle", 2015, "S", "La idea de competir en una clase de carros idénticos, para que la habilidad al volante sea lo primordial y el tamaño de la chequera no importe, es algo natural para los iRacers: es un tema central de la comunidad de iRacing. La clase original y exitosa de diseño único en el automovilismo, introducida hace un cuarto de siglo en las carreras amateur del Sports Car Club of America y todavía muy vigente hoy, es el Spec Racer Ford. Fabricado y comercializado por SCCA Enterprises, el Spec Racer Ford es un deportivo de competencia construido específicamente para ese fin. Con más de 850 unidades fabricadas, es uno de los carros de carreras dedicados más prolíficos del mundo, y ha servido como plataforma de lanzamiento para varios pilotos que después lograron un éxito considerable. Demostrando aún más su compromiso con la clase, la SCCA introdujo la fórmula Spec Racer Ford Gen3 en 2015: un nuevo motor de 1.6 litros montado sobre los soportes existentes aporta 30 caballos adicionales y aligera el carro en más de 45 kilos, con una velocidad máxima superior de 241 km/h como cereza del pastel."),
      c("Cadillac CTS-V Racecar", "tcr", 2011, "S", "Tomando prestada una frase de otra división de General Motors, este no es el Cadillac de tu papá... ni de cerca. El Cadillac CTS-V es un carro de carreras muy serio, con un V8 de 460 caballos producido en cooperación con Katech Engine Development y un chasis diseñado y desarrollado por Pratt & Miller. La colaboración entre Katech y Pratt & Miller es la misma que produjo el Corvette C6.R GT1 que dominó la competencia IMSA y GT1 de Le Mans durante años y que, más recientemente, llevó al Corvette al frente de la clase GT2. No debería sorprender, entonces, que el CTS-V estuviera a la altura de su herencia en el Pirelli World Challenge en manos de pilotos como Johnny O'Connell, Andy Pilgrim y Ricky Taylor.", { w: "redondo" }),
      c("Kia Optima", "tcr", 2013, "S", "Cuando se trata de fabricantes de automóviles, ninguno ha disfrutado de un ascenso más meteórico a la prominencia que Kia. Tecnologías de vanguardia y un estilo de influencia europea han impulsado sus ventas en todo el mundo, particularmente en Estados Unidos, donde la cuota de mercado de Kia creció durante 18 años consecutivos. Los programas deportivos de Kia disfrutan de un éxito igualmente rápido: la marca consiguió dos victorias y siete podios en sus primeras dos temporadas del Continental Tire Sports Car Challenge, y sumó un par de triunfos y seis podios en su temporada de debut en la clase Grand Touring Sport del Pirelli World Challenge, antes de capturar el Campeonato de Fabricantes GTS de 2014. Con un motor turbo de cuatro cilindros, tracción delantera y transmisión de cambio sin levantar el acelerador, el Kia Optima es tan divertido de manejar como potente.", { w: "redondo" }),
      c("Ruf RT 12 R", "hiper", 2011, "H", "RUF Automobile GmbH es sinónimo de automóviles de alto rendimiento. Además de la preparación de motores y chasis y la restauración de algunos de los carros más rápidos del mundo, RUF es reconocida por el gobierno alemán como fabricante automotriz por derecho propio. La compañía fue fundada en 1939 como un taller de servicio automotriz por Alois Ruf padre, quien más tarde diseñó y construyó vehículos propios en los años 50. Aficionado a los deportivos, Alois Ruf hijo siguió los pasos de su padre y produjo el primer Porsche 911 mejorado por RUF en 1975. El RUF RT12 R es de lo más alto del rendimiento mundial: en su corazón hay un bóxer de seis cilindros biturbo de 3.8 litros que produce 730 caballos y casi 950 Nm de torque, en un deportivo elegante que pesa menos de 1.500 kilos. Acoplado a una transmisión de seis velocidades, alcanza una velocidad máxima de 370 km/h. Las variantes C-Spec y Track son carros de carreras completos con caja secuencial de seis velocidades.", { w: "redondo", s: "rojo", notas: ["Variante de calle: manual en H + embrague VRS. Variantes C-Spec y Track: secuencial de palanca."] }),
      c("Mazda MX-5 Roadster", "calle", 2010, "H", "MX-5, Miata, Eunos Roadster... con cualquier nombre, el enormemente popular deportivo biplaza de Mazda ha figurado por mucho tiempo entre los automóviles más corridos del mundo. Columna vertebral de la Mazda MX-5 Cup de SCCA Pro Racing, y todavía una propuesta competitiva en carreras de club de todo el planeta: donde encuentres competencia automovilística, encontrarás un Mazda MX-5. El MX-5 ofrece un balance satisfactorio de potencia y agilidad, envuelto en una forma clásica y a un precio muy razonable. Nacido del deseo de Mazda de construir un deportivo ligero y mecánicamente sencillo, el primer MX-5 salió a la venta en 1989 y fue ampliamente elogiado por la prensa especializada. El carro evolucionó con los años, particularmente en potencia, y la tercera generación estrenó una suspensión trasera revisada de cinco brazos. La edición Roadster tiene el volante a la derecha, un desafío único para quienes buscan una experiencia divertida de nivel de acceso."),
      c("Ford Mustang FR500S", "calle", 2008, "H", "El Ford Mustang FR500S encarna una rica herencia deportiva que se remonta a los días en que Parnelli Jones, George Follmer y otros manejaban Mustangs preparados por Bud Moore en combate cuerpo a cuerpo contra Mark Donohue, Dan Gurney, Swede Savage, Sam Posey y otros íconos estadounidenses en la Trans-Am Series original. Por algo a toda una clase de sedanes convertidos en deportivos se les conoció como \"pony cars\". Desarrollado para la serie Mustang Challenge, el Mustang FR500S fue el primer carro de carreras construido en una línea de producción de Ford y vendido al público. Presume un motor V8 de aluminio de 4.6 litros y tres válvulas por cilindro homologado en 325 caballos, junto con una variedad de piezas de rendimiento Ford Racing, incluyendo kit de admisión fría, radiador de alta capacidad, paquete aerodinámico y amortiguadores y resortes ajustables en dos vías. El Mustang va equipado con una transmisión Ford Racing Tremec T6060 de seis velocidades, embrague y palanca de recorrido corto."),
      c("Pontiac Solstice Club Sport", "calle", 2006, "H", "Cuando la división Pontiac de General Motors creó un éxito instantáneo con el público al presentar el roadster Solstice, también creó un gran competidor de circuito en la categoría showroom stock. En su versión Z0K Club Sport, desarrollada por la GM Performance Division, el Solstice ganó títulos nacionales consecutivos de Showroom Stock B del Sports Car Club of America. Con una distribución de pesos cercana al 50/50 y un sofisticado sistema de suspensión totalmente independiente, el Solstice es un carro bien equilibrado y de buen comportamiento. Con un peso en orden de marcha (incluido el piloto) de poco más de 1.360 kilos y 177 caballos, el Solstice es un carro de inercia, lo que en realidad lo convierte en una gran herramienta de aprendizaje. El Solstice premia la suavidad y la precisión, habilidades críticas para volverse rápido en cualquier carro, y castiga las manos torpes sobre los controles de una forma que queda enmascarada en carros más potentes."),
      c("VW Jetta TDI Cup", "calle", 2009, "L", "Con un motor turbo de cuatro cilindros en línea de dos litros con intercooler que entrega cifras como 168 caballos y 380 Nm de torque entre 1.900 y 2.500 rpm, el VW Jetta TDi tiene todo el rendimiento que le puedes pedir a un sedán compacto. El Volkswagen cuenta con una transmisión automática DSG de seis velocidades y doble embrague, y un sistema ABS ATE Racing con pinzas Brembo fijas de cuatro pistones adelante y Lucas flotantes de un pistón atrás. Junta todo eso y tienes la definición de un sedán deportivo de alto rendimiento, uno que algunos de los mejores talentos jóvenes de Estados Unidos usaron para lanzar sus carreras entre 2008 y 2011 en la Jetta TDI Cup de SCCA Pro Racing.", { w: "podium", notas: ["Caso especial: el volante real es redondo de calle, pero lleva levas del DSG. Como el Circular no tiene levas, el Flat Bottom es el compromiso más cercano."] }),

      // ---------- NASCAR ----------
      c("NASCAR Next Gen — Chevrolet Camaro ZL1", "nascar", 2022, "S", "El carro Next Gen de NASCAR debutó en iRacing antes que en cualquier otro lado, como preparación para su campaña inaugural en la NASCAR Cup Series real en 2022. Con una serie de innovaciones tecnológicas, desde un nuevo diseño de chasis y suspensión trasera independiente hasta una transmisión secuencial y ruedas de tuerca única, el Next Gen está diseñado para seguir empujando el deporte hacia adelante. Tras usar el modelo durante varios años en la NASCAR Xfinity Series, Chevrolet introdujo el Camaro en la Cup Series por primera vez en 2018, y el Camaro continúa como el carro Next Gen de la marca. Igual que sus contrapartes de Ford y Toyota, lo impulsa una planta motriz V8 de 5.9 litros y pesa 1.542 kilos con piloto y combustible. Tras varios años de pruebas por parte de algunos de los nombres más grandes del deporte, el Camaro Next Gen hizo su debut real en la Daytona 500 de 2022.", { notas: ["En óvalos apenas se frena (azul perfecto); en rutero exige frenadas fuertes."] }),
      c("NASCAR Next Gen — Ford Mustang", "nascar", 2022, "S", "El carro Next Gen de NASCAR debutó en iRacing antes que en cualquier otro lado, como preparación para su campaña inaugural en la NASCAR Cup Series real en 2022. Con una serie de innovaciones tecnológicas, desde un nuevo diseño de chasis y suspensión trasera independiente hasta una transmisión secuencial y ruedas de tuerca única, el Next Gen está diseñado para seguir empujando el deporte hacia adelante. Apenas tres años después de su debut en la Cup, la marca Ford Mustang entra en la siguiente generación de NASCAR con el carro Next Gen. Igual que sus contrapartes de Chevrolet y Toyota, lo impulsa una planta motriz V8 de 5.9 litros y pesa 1.542 kilos con piloto y combustible. Tras varios años de pruebas por parte de algunos de los nombres más grandes del deporte, el Mustang Next Gen hizo su debut real en la Daytona 500 de 2022."),
      c("NASCAR Next Gen — Toyota Camry XSE", "nascar", 2024, "S", "El carro Next Gen de NASCAR debutó en iRacing antes que en cualquier otro lado, como preparación para su campaña inaugural en la NASCAR Cup Series real en 2022. Con una serie de innovaciones tecnológicas, desde un nuevo diseño de chasis y suspensión trasera independiente hasta una transmisión secuencial y ruedas de tuerca única, el Next Gen está diseñado para seguir empujando el deporte hacia adelante. El Camry continúa como el único modelo de Toyota en la competencia de la NASCAR Cup Series desde el debut de la marca en 2007. Igual que sus contrapartes de Chevrolet y Ford, lo impulsa una planta motriz V8 de 5.9 litros y pesa 1.542 kilos con piloto y combustible. Tras varios años de pruebas por parte de algunos de los nombres más grandes del deporte, el Camry Next Gen hizo su debut real en la Daytona 500 de 2022."),
      c("EURO NASCAR V8GP", "nascar", 2026, "S", "Aunque los óvalos escasean en Europa, las carreras de stock car han encontrado igualmente su nicho en el continente a través de un campeonato oficial de NASCAR desde 2012. Lo que hoy se conoce como NASCAR Euro Series corrió su primera temporada en 2009 como Racecar Euro Series, generando el impulso suficiente para cerrar una alianza con NASCAR antes de su campaña de 2012. Los mejores circuitos ruteros europeos como Brands Hatch, Zolder, Valencia o el Circuit Paul Ricard han albergado la serie, además de un puñado de óvalos cortos que también han aparecido en el calendario. El carro de la NASCAR Euro Series pesa 1.225 kilos y monta un motor V8 de 5.7 litros que produce más de 400 caballos. En 2021 se convirtió en el primer vehículo NASCAR en llevar una transmisión secuencial, un año antes de que los carros Next Gen la introdujeran en la Cup Series. El mismo carro se usa en las divisiones V8GP, OPEN y Rookie Challenge."),
      c("NASCAR Xfinity (Camaro / Mustang / Supra)", "nascar", 2019, "H", "El Chevrolet NASCAR Xfinity Camaro es el último escalón de la escalera del stock car antes de los Chevy, Ford y Toyota de la Gen6 que se corren en las series NASCAR de iRacing. Igual que sus contrapartes de la NASCAR Xfinity Series, el Camaro es impulsado por un V8 de varillas de 5.8 litros que entrega entre 650 y 700 caballos (450 con placas restrictoras) y monta splitters delanteros y alerones traseros no ajustables, junto con una variedad de características de seguridad que incluyen doble larguero de chasis alineado con los parachoques delantero y trasero para mejorar la protección en impactos laterales."),
      c("NASCAR Trucks (Silverado / F-150 / Tundra / Ram)", "nascar", 2018, "H", "¿Por qué correr camionetas? Para empezar, son posiblemente el vehículo más popular de Estados Unidos, con más de 2 millones de pickups nuevas vendidas cada año en ese país. Y son una explosión de diversión para correr, particularmente las de la NASCAR Craftsman Truck Series. Con 625 caballos empujando sus 1.565 kilos por superóvalos, óvalos, short tracks y algún circuito rutero ocasional, las camionetas de NASCAR son divertidas de ver y desafiantes de manejar. Ningún fabricante se ha divertido más en la NASCAR Craftsman Truck Series que Chevrolet, y su Silverado fue completamente renovado y actualizado para iRacing en 2019. El contingente del moño ganó los primeros cuatro títulos de fabricantes de la serie entre 1995 y 1998 y no ha mirado atrás desde entonces."),
      c("ARCA Menards (Toyota / Chevrolet / Ford)", "nascar", 2015, "H", "Para los pilotos de stock car que buscan convertirse en el próximo campeón de la NASCAR Cup Series, la ARCA Menards Series es el primer paso hacia la gloria. Aunque ARCA comparte muchos short tracks con varias series de late model, su gira nacional también incorpora los óvalos más grandes y rápidos de Estados Unidos, incluido Daytona International Speedway, donde correr la fecha inaugural de ARCA suele ser el primer paso para los pilotos que quieren competir en la Daytona 500. La carrocería compuesta actual de ARCA se presentó a finales de 2014, debutó en short tracks en 2015 y comenzó a correr en superóvalos en 2016 antes de reemplazar por completo a los carros de carrocería de acero en 2020. El Chevrolet SS ha sido la entrada de la marca en la serie desde entonces, y es una de las opciones más populares tanto entre equipos de tiempo completo como de medio tiempo."),
      c("NASCAR Legends 1987 (Monte Carlo / Thunderbird / LeSabre / Grand Prix)", "nascar", 1987, "H", "La icónica sociedad entre el piloto Dale Earnhardt y el dueño de equipo Richard Childress llegó a definir la NASCAR Cup Series durante casi dos décadas, con Earnhardt ganando seis de sus siete campeonatos en las filas de RCR. Tras ganar su primer título juntos en 1986, Earnhardt regresó con sed de venganza en 1987, llevándose el campeonato por casi 500 puntos después de estrangular al pelotón con 11 victorias y sumar un triunfo en la All-Star Race con el mítico \"Pass in the Grass\". Sal a pista con uno de los carros más dominantes de Earnhardt de todos los tiempos y descubre si tienes algo del Intimidador dentro de ti."),
      c("NASCAR Cup Gen 6 (Chevrolet SS / Ford Fusion / Toyota Camry)", "nascar", 2013, "H", "El carro de sexta generación de la NASCAR Cup Series marca un regreso bienvenido a la herencia de NASCAR de \"gana el domingo, vende el lunes\". Con un estilo de carrocería distintivo que se parece a su contraparte de showroom, el Gen-6 Chevrolet SS es una declaración audaz de identidad de marca a más de 320 km/h. Sin embargo, la belleza es más que superficial: el Chevy SS luce una aerodinámica de bajos que hace al carro estable en tráfico y favorece las carreras cerradas. Entre sus características clave de seguridad están una banda de techo delantera y un soporte central de techo que refuerzan la integridad estructural, junto con aletas de techo para reducir la probabilidad de que los carros se levanten en los accidentes. Como todos los Gen6, el Chevy SS tiene un peso mínimo total de 1.497 kilos, capó y tapa de cajuela de fibra de carbono y un alerón trasero de 135 cm de ancho."),
      c("NASCAR Cup Gen 4 (Legacy)", "nascar", 2003, "H", "El NASCAR Cup Series Gen 4 Chevrolet está basado en el carro de cuarta generación de la NASCAR Cup Series que corrió hasta 2007, cuando el Car of Tomorrow tomó el relevo. Los carros Gen 4 debutaron a principios de los años 90 y se usaron durante todo el auge de NASCAR de finales de los 90 y principios de los 2000, llevando a Jeff Gordon a sus cuatro campeonatos y tanto a Dale Earnhardt como a Jimmie Johnson a algunos de sus siete: a Earnhardt al último en 1994, y a Johnson al primero en 2006. El Gen 4 de iRacing es una versión de mayor potencia del mismo carro usado en la ARCA Menards Series, subiendo el V8 de 5.9 litros hasta 725 caballos. La potencia extra hace la experiencia de manejo más desafiante, y es un guiño para quienes añoran los días de una de las eras clásicas de NASCAR."),
      c("Fury Race Cars SRX", "nascar", 2021, "H", "Los legendarios pilotos Tony Stewart y Ray Evernham pusieron el mundo de cabeza cuando anunciaron la creación de la Superstar Racing Experience en julio de 2020. El concepto casó elementos de antiguas series de estrellas con el tour sénior de golf y las carreras semanales de short track: seis semanas seguidas de acción en verano sobre una mezcla de óvalos pavimentados y de tierra, con un grupo ecléctico de campeones, jóvenes promesas y hasta algunos héroes locales que se ganaron su lugar en la parrilla para una sola oportunidad de gloria junto a los profesionales. Diseñado desde cero por Evernham y construido por Fury Race Cars, el SRX es un stock car como ningún otro. Equipados con motores V8 Ilmor de 700 caballos y un alerón alto sacado directamente de los años 70, estos carros fueron construidos para mucha potencia y poca carga aerodinámica, lo que los hace un desafío para manejar. Igual que en el mundo real, el SRX de iRacing viene equipado con neumáticos de asfalto y de tierra."),
      c("Sprint Car 410 (asfalto)", "nascar", 2016, "N", "Nada personifica mejor el automovilismo de base estadounidense que el sprint car. Su icónica forma de patín de ruedas evoca una época en la que figuras como Bill Vukovich, Jimmy Bryan y Parnelli Jones se abrieron paso a arañazos desde los short tracks de Estados Unidos hasta un lugar en la primera fila de las 500 Millas de Indianápolis. Ganar una final de sprint car en Terre Haute ya no es un boleto directo a Indy, pero los sprint cars siguen jugando un papel vital tanto como trampolín para pilotos como Jeff Gordon, Tony Stewart y Kasey Kahne, como en la cúspide de la pirámide del short track. Con una distancia entre ejes compacta y una relación peso-potencia cercana a la de un Fórmula 1 moderno, domar un sprint car en un óvalo cerrado durante 20 o 30 vueltas no es para cardíacos. Sin embrague, volante de inercia ni transmisión, usan un sistema de tracción directa accionado desde la cabina. Sin motor de arranque a bordo ni siquiera batería, dependen de un empujón (normalmente de una camioneta) y los mueve un motor de varillas de 6.7 litros.", { notas: ["Sin cambios que hacer: transmisión directa."] }),
      c("USAC Silver Crown", "nascar", 2016, "S", "El C&R Racing Silver Crown remonta su linaje a los primeros carros de monoplaza que corrían en las pistas de caballos de las ferias de condado hace un siglo. En los años 60, el diseño de los Indy car se fue hacia carros bajos de motor central derivados de la tecnología de la Fórmula 1 de la época, así que en 1971 USAC designó un campeonato separado (hoy llamado Silver Crown) para los descendientes de aquellas bestias clásicas de chasis tubular, posición erguida y motor delantero que habían dominado la competencia Indy durante décadas. Conforme se corrían más carreras importantes en superóvalos de 2,4 kilómetros o más, USAC desarrolló un nuevo conjunto de especificaciones técnicas que reflejaban los requisitos de seguridad y aerodinámica para un carro capaz de dar vueltas a más de 270 km/h. Con más de 800 caballos en las ruedas traseras de un carro que pesa 748 kilos, esta última generación del Silver Crown es uno de los monoplazas de motor delantero más rápidos de la historia en óvalo."),
      c("NASCAR Whelen Tour Modified", "nascar", 2020, "H", "Con techo pero sin guardafangos, un Modified Stock Car —\"Modified\" para abreviar— es un carro de óvalo único. Y aunque el Modified de hoy se construye desde cero como un carro de chasis tubular y tiene configuraciones muy distintas para pistas de asfalto o de tierra, la raza remonta su linaje al mismísimo inicio de las carreras de stock car. Ligero y calzado con neumáticos más anchos, un Modified actual es puro carro de carreras y mucho más rápido en un óvalo corto pavimentado que un carro de la Cup de NASCAR. En los años 30, los corredores quitaban las ventanas y cortaban los guardafangos de sus carros para reducir peso y trucaban los motores para ganar potencia. Con el tiempo empezaron a sustituir la mecánica y luego chasis completos bajo sus coupés y sedanes de los 30, hasta que finalmente no quedó nada \"stock\" en estos carros. Hoy, NASCAR organiza el Whelen Modified Tour para carros de especificación completa con un peso mínimo de 1.200 kilos con piloto, impulsados por V8 de bloque pequeño con carburadores Holley de cuatro cuerpos y generando más de 600 caballos."),
      c("SK Modified", "nascar", 2020, "H", "Con techo pero sin guardafangos, un Modified Stock Car es un carro de óvalo único, cuyo linaje se remonta al inicio mismo de las carreras de stock car. Hoy, los Modified de asfalto corren mayormente en los estados del noreste y el Atlántico medio en dos configuraciones distintas, conocidas como NASCAR Whelen Tour Modifieds y SK Modifieds. Por razones económicas, muchas pistas locales corren el reglamento SK Modified que se originó en el Stafford Springs Speedway de Connecticut. El SK Modified es similar al Tour Modified tanto en peso mínimo (1.180 kilos con el piloto) como en el sesgo máximo de peso al lado izquierdo del 56 %. Sin embargo, en aras del ahorro de costos, el SK Modified va equipado con un motor V8 de 5.9 litros de baja compresión, sistema de lubricación de cárter húmedo y un carburador Holley de dos cuerpos que produce alrededor de 385 caballos."),
      c("Late Model Stock", "nascar", 2022, "H", "Usado en series como el CARS Late Model Stock Tour y por todas las Carolinas, el Late Model Stock Car es un paso importante en la carrera de muchas de las principales estrellas del stock car. Los nombres que han pasado por la serie camino a la gloria nacional van desde punteros actuales de la NASCAR Xfinity Series como Josh Berry, Sam Mayer y Myatt Snider, hasta pilotos de la Craftsman Truck Series como Hailie Deegan y Christian Eckes, e incluso el novato de la Cup Series de 2023 Ty Gibbs. El Late Model Stock Car es impulsado por un motor de 5.7 litros —hay versiones de crate y de preparación libre— que produce bastante más de 400 caballos. Los paneles de carrocería de fibra de vidrio ayudan a mantener el carro ligero, pero siguen siendo lo bastante resistentes para aguantar la naturaleza de contacto pleno de las carreras de short track."),
      c("Super Late Model", "nascar", 2018, "H", "El Super Late Model figura entre los carros más rápidos que jamás hayan pisado un short track. El V8 de 5.9 litros entrega más de 550 caballos, pero eso es apenas el comienzo. Con un peso de 1.270 kilos y una suspensión trasera totalmente ajustable, más la distribución de peso descentrada de un chasis de largueros rectos, el Super Late Model es un cruce entre un Modified y un carro de la NASCAR Xfinity. Considerando las enormes cantidades de carga aerodinámica que generan su carrocería y sus bajos, el Super Late Model es capaz de generar velocidades de paso por curva mayores que las de un Chevy SS, Ford Fusion o Toyota Camry de la Gen6 de NASCAR. Para la Season 2 de 2021, el Super Late Model de iRacing recibió una actualización de carrocería que refleja los carros de nueva generación que se han ido abriendo paso en las principales promociones del país."),
      c("Mini Stock (asfalto)", "nascar", 2023, "H", "¿Buscas un paso divertido y accesible hacia las carreras de óvalo? El Mini Stock es una de tus mejores apuestas. Con motores de cuatro cilindros, estos carros más pequeños y de carrocería completa son una gran forma de aprender los fundamentos de ir rápido y girar a la izquierda antes de subirte a un street stock, un late model o cualquier cosa más arriba en la escalera. El Mini Stock de iRacing está configurado para divertir tanto en óvalos pavimentados como de tierra, reflejando su uso diverso en el mundo real. Con más de 200 caballos bajo el capó y un peso relativamente ligero de 1.066 kilos, esta es una de las experiencias de manejo más ágiles y a la vez accesibles que tendrás en cualquiera de las dos superficies."),
      c("Street Stock", "nascar", 2010, "H", "Cuando se trata de automovilismo de base, no hay nada más \"de raíz\" que los Street Stock. Aunque hay (casi) tantas variantes distintas de reglamento de Street Stock como pistas de un cuarto y media milla hay en Estados Unidos, el hilo común es el uso de un carro de calle americano antiguo como base del carro de carreras. Dependiendo de la pista y de sus reglas (y de tu presupuesto), los Street Stock van desde poco más que un carro de calle con el interior destripado, las ventanas quitadas y una jaula antivuelco rudimentaria, hasta un carro de carreras completo con motor muy trabajado, suspensión mejorada y carrocería de plástico que replica la forma del carro original. El Street Stock de iRacing está construido conforme al reglamento de carro de carreras completo. Convertir un carro de calle en un Street Stock no solo es más barato que comprar un carro de carreras hecho a propósito: el proceso ayuda a los aspirantes a piloto y mecánico a aprender los fundamentos de la construcción, el mantenimiento y las puestas a punto."),
      c("Legends Ford '34 Coupe", "nascar", 2015, "S", "Con su estilo de carrocería de los años 30, el Legends Car parece un modelo a escala 5/8 de los Modified caseros que dominaron las carreras de NASCAR en los años 50. Pero bajo la carrocería de fibra de vidrio vive un carro de chasis tubular completamente moderno, de alta tecnología y totalmente ajustable. Y si los Modified caseros representaron el nacimiento de NASCAR, el económico Legends Car de fabricación industrial ha impulsado la popularidad de las carreras de short track y ha servido como campo de entrenamiento para las futuras estrellas de NASCAR. Desde que el legendario promotor H.A. \"Humpy\" Wheeler y el piloto Elliott Forbes-Robinson sacaron el primer Legends Car al asfalto del Lowe's Motor Speedway en 1992, más de 4.000 de estos diminutos carros han salido a correr en pistas de América, Europa y Asia. El uso de un motor y transmisión de motocicleta Yamaha de 1.250 cc, muy fiable y de bajo mantenimiento, ayuda a mantener asequibles el precio de compra y los costos de operación."),

      // ---------- DIRT OVAL ----------
      c("Dirt Late Model (Limited / Pro / Super)", "dirt", 2017, "S", "Igual que sus contrapartes de asfalto (con las que comparten poco más que el nombre genérico), los Late Model están entre las clases más sofisticadas y populares de las pistas de tierra de Norteamérica y Australia. \"Clases\" es el término clave, ya que existe una categoría de dirt Late Model —Sportsman, Limited y Super— para casi cada nivel de experiencia y presupuesto. Aunque las distintas categorías son similares por fuera, bajo las angulosas carrocerías de fibra de vidrio con sus característicos techos bajos, los Sportsman, Limited y Super son bastante diferentes. Generalmente restringidos a los niveles local y regional, los Sportsman (también llamados Crate) usan motores de 5.0 litros de fábrica para controlar costos y velocidad. En contraste, los Limited, que corren a nivel regional y nacional en series como la Lucas Oil Dirt Late Model Series y la World of Outlaws Late Model Series, montan motores preparados de 5.9 litros con casi el doble de potencia. Los Super vienen equipados con motores de competencia de 7.2 litros capaces de más de 850 caballos."),
      c("Dirt Sprint Car 410 / 360 / 305 (winged)", "dirt", 2017, "N", "Nada personifica mejor el automovilismo de base estadounidense que un sprint car lanzando tierra en uno de los incontables óvalos de tierra de un cuarto, tres octavos, media milla o milla que salpican el país. Su icónica forma de patín evoca una era en la que figuras como Bill Vukovich, Jimmy Bryan y Parnelli Jones se abrían paso desde los short tracks hasta la primera fila de las 500 Millas de Indianápolis. Más recientemente, Jeff Gordon, Tony Stewart, Kasey Kahne y Kyle Larson han usado los sprint cars como trampolín hacia NASCAR. Hay casi tantas variantes de sprint car como pistas de tierra y entes sancionadores: motores que van de 5.0 a 6.7 litros produciendo entre 450 y casi 900 caballos, en chasis que pesan entre 624 y 680 kilos y, de forma más evidente, con y sin alerón. Aunque algunos pilotos experimentaron con alerones desde los años 50, no fue sino hasta los 70 que los sprint cars empezaron a llevarlos sobre el morro y la cabina. La carga aerodinámica no solo permitió trazar las curvas más rápido, sino que los enormes alerones sobre la cabina aportaron una estructura deformable y por lo tanto más seguridad.", { notas: ["Sin cambios que hacer: olvídate de palanca y levas, aquí mandan las manos."] }),
      c("Dirt Sprint Car (non-winged)", "dirt", 2018, "N", "Nada personifica mejor el automovilismo de base estadounidense que un sprint car lanzando tierra en uno de los incontables óvalos de tierra que salpican el país. Hay casi tantas variantes de sprint car como pistas de tierra y entes sancionadores, y la división más evidente es entre carros con y sin alerón. Aunque algunos pilotos experimentaron con alerones desde los años 50, no fue sino hasta los 70 que los sprint cars empezaron a llevarlos sobre el morro y la cabina. La carga aerodinámica permitió trazar las curvas más rápido y los enormes alerones aportaron una estructura deformable y por lo tanto más seguridad. Dadas las altas velocidades de paso por curva que generan los carros con alerón, el deporte se dividió más o menos en dos direcciones: entes como la World of Outlaws y el All Star Circuit of Champions corren con alerón, mientras que otros, sobre todo el United States Auto Club, siguieron enfocados en los sprint cars sin alerón."),
      c("USAC 410 / 360 Sprint Car (non-winged)", "dirt", 2019, "N", "Nada personifica mejor el automovilismo de base estadounidense que un sprint car lanzando tierra en uno de los incontables óvalos que salpican el país. Más recientemente, Jeff Gordon, Tony Stewart, Kasey Kahne y Kyle Larson han usado los sprint cars como trampolín hacia NASCAR, mientras que figuras como Steve Kinser, Sammy Swindell, Donnie Schatz, Joey Saldana, Bryan Clauson y Levi Jones se han ganado la vida corriendo sprint cars de la World of Outlaws y del United States Auto Club tres, cuatro y cinco noches por semana. Hay casi tantas variantes de sprint car como pistas de tierra y entes sancionadores: motores de 5.0 a 6.7 litros produciendo entre 450 y casi 900 caballos, en chasis de entre 624 y 680 kilos. Dadas las altas velocidades de paso por curva que generan los carros con alerón, el deporte se dividió en dos direcciones, y el United States Auto Club siguió enfocado en los sprint cars sin alerón."),
      c("Dirt Midget", "dirt", 2017, "N", "Originados en Estados Unidos en los años 30 y hoy corridos a escala global, los Midget son un espectáculo increíblemente divertido de presenciar. Estos carros parecen muy pequeños pero cargan una enorme relación peso-potencia y normalmente usan motores de cuatro cilindros. Cuentan con varias características de seguridad, incluidas sus propias jaulas antivuelco, dada la naturaleza peligrosa de su potencia. Estos pequeños vehículos pesan apenas unos 408 kilos pero llevan motores capaces de entregar entre 300 y 400 caballos. Usados con frecuencia como trampolín hacia divisiones de alto perfil, las carreras de Dirt Midget suelen contar con pilotos de gran renombre como Tony Stewart, Kasey Kahne, Kyle Larson y otros. Posiblemente el evento más famoso de Dirt Midget, el Chili Bowl, se celebra a principios de enero en el Expo Square Pavilion de Tulsa, Oklahoma."),
      c("Dirt UMP Modified", "dirt", 2017, "S", "Los UMP Modified están construidos específicamente para las carreras de óvalo de tierra. Con 750 caballos, estos carros corren por todo Estados Unidos. Construidos conforme a las especificaciones de los United Midwestern Promoters (UMP), son algunos de los carros de óvalo de tierra más populares del país. El diseño del carro es un híbrido único: rueda descubierta adelante, stock car atrás. Más de 3.000 pilotos están registrados para competir en la clase Modified de rueda descubierta de UMP DIRTcar Racing, que sigue creciendo temporada tras temporada. El estilo único de la división, su accesibilidad económica, sus reglas estandarizadas y su competitividad la convierten en una opción popular tanto para veteranos guerreros de fin de semana como para jóvenes pilotos en ascenso."),
      c("Dirt Big Block Modified", "dirt", 2018, "S", "Increíblemente populares por todo el noreste de Estados Unidos, y con fechas adicionales tan al sur como Florida y tan al norte como Canadá, los dirt modified son tan divertidos de manejar como de ver. Aficionados increíblemente apasionados llenan las gradas mientras estas bestias van rueda a rueda en uno de los carros más singulares que pisan los óvalos cerrados de tierra de Norteamérica. Uno de los carros más queridos de las carreras de óvalo de tierra, el Big Block Modified de la Super DIRTcar Series produce unos contundentes 757 caballos desde su planta motriz atmosférica de 7.65 litros. Ponte al volante de las mismas máquinas que encabezan la Super DIRT Week, las DIRTcar Nationals, el Hall of Fame 100 y más, ¡y descubre si tienes lo necesario para salir victorioso!"),
      c("Dirt 358 Modified", "dirt", 2018, "S", "Increíblemente populares por todo el noreste de Estados Unidos, y con fechas adicionales tan al sur como Florida y tan al norte como Canadá, los dirt modified son tan divertidos de manejar como de ver. Aficionados increíblemente apasionados llenan las gradas mientras estas bestias van rueda a rueda en uno de los carros más singulares que pisan los óvalos cerrados de tierra de Norteamérica. El primo menos potente del Big Block Modified, el motor más pequeño y el peso ligeramente menor del 358 Modified hacen de este carro una versión más accesible para comenzar a dominar los modified de tierra. Aun así, con 510 caballos a tu disposición, sigue sin ser para cardíacos. Si eres nuevo en la disciplina, afinar tus habilidades con el 358 te ayudará a dar el salto al Big Block Modified y a encontrar el círculo de ganadores más rápido."),
      c("Dirt Micro Sprint (winged / non-winged)", "dirt", 2021, "S", "¿Quieres empezar en la escalera de las carreras de tierra? El Micro Sprint es tu primer paso. Una de las clases de carros pequeños de más rápido crecimiento en Estados Unidos, no te sorprendas si ves que muchos de los pilotos que compiten en estas máquinas pequeñas pero ágiles se convierten en las futuras estrellas del automovilismo profesional. Ya sea en una serie semanal, en campeonatos itinerantes que recorren el país o en eventos importantes como el Tulsa Shootout, son una forma divertida y accesible de salir a pista y pasarla bien. Los Micro Sprint corren mayormente en pistas pequeñas, como el Millbridge Speedway de un cuarto de milla en Carolina del Norte. Equipados con un motor de 600 cc que produce más de 120 caballos, tienen potencia suficiente para que los jóvenes aprendan las habilidades que necesitan para subir de categoría, pero son lo bastante accesibles como para no abrumarlos. La versión con alerón ofrece carga aerodinámica adicional, facilitando el manejo a algunos pilotos."),
      c("Dirt Outlaw Micro Sprint (winged / non-winged)", "dirt", 2022, "S", "¿Quieres empezar en la escalera de las carreras de tierra? El Micro Sprint es tu primer paso. Una de las clases de carros pequeños de más rápido crecimiento en Estados Unidos, no te sorprendas si ves que muchos de estos pilotos se convierten en las futuras estrellas del automovilismo profesional. Los Micro Sprint corren mayormente en pistas pequeñas, como el Millbridge Speedway de un cuarto de milla en Carolina del Norte. La versión Outlaw del carro va equipada con un motor de 600 cc que produce más de 160 caballos: potencia suficiente para que los jóvenes aprendan las habilidades que necesitan para subir de categoría, pero lo bastante accesible como para no abrumarlos. La versión con alerón ofrece carga aerodinámica adicional, facilitando el manejo a algunos pilotos."),
      c("Dirt Mini Stock", "dirt", 2023, "H", "¿Buscas un paso divertido y accesible hacia las carreras de óvalo? El Mini Stock es una de tus mejores apuestas. Con motores de cuatro cilindros, estos carros más pequeños y de carrocería completa son una gran forma de aprender los fundamentos de ir rápido y girar a la izquierda antes de subirte a un street stock, un late model o cualquier cosa más arriba en la escalera. El Mini Stock de iRacing está configurado para divertir tanto en óvalos pavimentados como de tierra, reflejando su uso diverso en el mundo real. Con más de 200 caballos bajo el capó y un peso relativamente ligero de 1.066 kilos, esta es una de las experiencias de manejo más ágiles y a la vez accesibles que tendrás en cualquiera de las dos superficies. Incluso si las carreras de óvalo no son lo tuyo, unas cuantas vueltas al volante de uno de estos carros podrían hacerte cambiar de opinión."),
      c("Dirt Street Stock", "dirt", 2017, "H", "Cuando se trata de automovilismo de base, no hay nada más \"de raíz\" que los Street Stock. Aunque hay (casi) tantas variantes distintas de reglamento de Street Stock como óvalos existen, el hilo común es el uso de un carro de calle americano antiguo como base del carro de carreras. Dependiendo de la pista y de sus reglas (y de tu presupuesto), los Street Stock van desde poco más que un carro de calle con el interior destripado, las ventanas quitadas y una jaula antivuelco rudimentaria, hasta un carro de carreras completo con motor muy trabajado, suspensión mejorada y carrocería de plástico que replica la forma del carro original. Los Street Stock de iRacing están construidos conforme al reglamento de carro de carreras completo. Convertir un carro de calle en un Street Stock no solo es más barato que comprar un carro hecho a propósito: el proceso ayuda a aprender los fundamentos de la construcción, el mantenimiento y las puestas a punto."),
      c("Dirt Legends Ford '34 Coupe", "dirt", 2017, "S", "Con su estilo de carrocería de los años 30, el Legends Car parece un modelo a escala 5/8 de los Modified caseros que dominaron las carreras de NASCAR en los años 50. Pero bajo la carrocería de fibra de vidrio vive un carro de chasis tubular completamente moderno, de alta tecnología y totalmente ajustable. La alta tecnología y el bajo costo no suelen ir juntos en el automovilismo, pero mientras el Legends Car cuenta con suspensión totalmente ajustable para afinar el chasis, un motor y transmisión de motocicleta Yamaha de 1.250 cc, fiable y de bajo mantenimiento, mantienen asequibles el precio de compra y los costos de operación. Y aunque el Yamaha de serie entrega apenas 122 caballos, el peso total con piloto de 590 kilos hace que este diminuto carro tenga un rendimiento nada diminuto. Desde 1992, miles de estos pequeños carros han salido a correr en óvalos, pavimentados y de tierra, y en circuitos ruteros de América, Europa y Asia."),

      // ---------- RALLYCROSS / OFF-ROAD ----------
      c("Volkswagen Beetle GRC", "rally", 2016, "S", "Un pequeño escarabajo que pega muy duro: el Volkswagen Beetle cruza el asfalto y la grava sin esfuerzo con su motor turbo de cuatro cilindros. Defendida por el piloto profesional de rallycross Scott Speed, su máquina de 560 caballos ha demostrado ser una potencia formidable, ganando tres títulos de campeonato consecutivos (2015, 2016 y 2017). El Beetle de tracción total puede acelerar de 0 a 96 km/h en apenas dos segundos, lo que significa que le sacarás provecho a la caja de cambios de competencia de seis velocidades montada transversalmente desde la mismísima salida. Este Volkswagen Beetle luce una forma retro que rinde homenaje al Volkswagen Type 1 original, el carro de una sola plataforma más longevo y más fabricado de la historia.", { notas: ["Tu combinación rally: aro redondo + Rally Module + palanca secuencial."] }),
      c("Ford Fiesta RS WRC", "rally", 2016, "S", "La capacidad de ir de 0 a 96 km/h en menos de 2 segundos es una hazaña fenomenal. Probablemente no una hazaña que esperarías del amigable Ford Fiesta de tu vecindario. Pero toma ese Fiesta y móntale un motor turbo de 2.0 litros y 600 caballos impulsando las cuatro ruedas, y esa es exactamente la clase de aceleración que obtienes. Los carros de rallycross son pequeñas bestias como ningún otro vehículo, y el Ford Fiesta RS WRC no es la excepción. Manejado por Steve Arpin en múltiples series de rallycross, este vehículo pasa de la tierra al asfalto y de vuelta a la tierra sin ninguna dificultad."),
      c("FIA Cross Car", "rally", 2022, "S", "Ya sea que tengas sueños de llegar a los niveles más altos del rallycross y el autocross global o simplemente busques un carro divertido con el cual lanzar tierra, los cross car son opciones especialmente populares en Europa —sobre todo entre los pilotos jóvenes— y están ganando terreno en Estados Unidos. El FIA Cross Car representa el nivel más alto de maquinaria dentro de una escalera cuidadosamente diseñada que permite a pilotos de tan solo seis años iniciarse en la disciplina. El Cross Car de máximo nivel produce 120 caballos desde el mismo motor Yamaha MT-09 de 850 cc que impulsa a los Legends de todo el mundo. Con un peso de apenas 345 kilos, eso es más que suficiente para tiempos de vuelta rápidos en pistas de todo tipo. El carro se ha probado en el Campeonato Europeo FIA de Cross Car con un título en manos del piloto David Méat.", { s: "azul" }),
      c("Subaru WRX STI (Rallycross)", "rally", 2022, "S", "Subaru, un nombre sinónimo de rally y rallycross. Entra el Subaru WRX STI Supercar: un carro de rallycross construido específicamente para medirse de tú a tú con los VW Beetle y Ford Focus de la disciplina. Diseñado y construido por Vermont SportsCar, el Subaru carga 585 caballos bajo el capó y aplica la potencia al piso mediante un sistema de tracción total. Una caja secuencial hace que cambiar de marcha sea muy sencillo mientras peleas el carro por las curvas, sobre los saltos y lidias con las superficies siempre cambiantes de tierra y asfalto."),
      c("Lucas Oil Pro 2 Truck", "offroad", 2017, "S", "¡La Lucas Oil Off Road Racing Series ya está disponible en iRacing, y la inmensamente popular clase de camionetas Pro 2 viene incluida! Igual que sus contrapartes Pro 4, las Pro 2 son bestias absolutas bajo el capó, produciendo hasta 900 caballos. También tienen el mismo recorrido de suspensión que su hermana un poco más grande. Pero con solo dos ruedas motrices y una distancia entre ejes ligeramente menor, no solo son un campo de entrenamiento perfecto para pilotos que buscan subir algún día a Pro 4, sino que también son una casa a largo plazo para algunos de los nombres más grandes del deporte. Especificaciones: camionetas de tamaño completo de tracción trasera sobre chasis estandarizado, más de 700 caballos (típicamente entre 700 y 900), 46 cm de recorrido de suspensión delantera y 51 cm trasera, y un peso mínimo de 1.814 kilos incluyendo al piloto."),
      c("Lucas Oil Pro 4 Truck", "offroad", 2017, "S", "¡iRacing te da la oportunidad de manejar las mejores camionetas del off-road de circuito corto! Las Pro 4 son los vehículos más grandes y bravos de la Lucas Oil Off Road Racing Series. Estas camionetas de carreras de tamaño completo y tracción en las cuatro ruedas pueden presumir hasta 900 caballos y hasta 51 cm de recorrido de suspensión. Están diseñadas para correr en algunas de las condiciones más agrestes del automovilismo, volando más de 30 metros por el aire en saltos enormes, trazando la tierra en curvas de alta velocidad y aguantando contacto fuerte de otros vehículos. Una cosa es segura: no se parecen a ningún otro vehículo de iRacing, salvo quizá a sus contrapartes Pro 2."),
      c("Pro 2 Lite Truck", "offroad", 2017, "S", "¡Prueba todo lo que la Lucas Oil Off Road Racing Series tiene para ofrecer en iRacing con la Pro 2 Lite! Esta camioneta está construida exactamente como la Pro 2 del mundo real que compite en la LOORRS, pero con potencia reducida para ayudarte a hacer la transición al off-road de circuito corto y aprender los pormenores de controlar estas camionetas. Los vehículos de la Lucas Oil Off Road Racing Series cuentan con un recorrido de suspensión enorme, están construidos para atravesar tierra fuertemente surcada y saltos gigantescos, y pueden aguantar contacto fuerte de otros competidores. La mayor diferencia entre las clases insignia Pro 4 y Pro 2 es la cantidad de ruedas motrices: las Pro 2 son de tracción trasera, lo que presenta un conjunto único de desafíos. Un control cuidadoso del acelerador es la clave para tiempos de vuelta rápidos."),

    function recomendar(car) {
      const meta = CATS[car.cat];
      const wheelKey = car.w || meta.w;
      const springKey = car.s || meta.s;
      const shift = SHIFTS[car.t];
      const notas = [...(car.notas || [])];
      const kg = car.kg || (springKey === meta.s ? meta.kg : springKey === "azul" ? "55–70" : "85–110");

      if (car.t === "L") {
        if (wheelKey === "formula")
          notas.push("Salida parada: usa las levas de embrague del Formula 2.5X. Las 2 levas extra: asígnalas a control de tracción y reparto de frenada.");
        else if (wheelKey === "gt3")
          notas.push("Salida parada: usa las levas de embrague del CSL GT3 para clavar el launch.");
        else if (wheelKey === "podium")
          notas.push("El carro real no tiene pedal ni leva de embrague: el Podium 330mm no lleva clutch paddles porque no los necesitas.");

      if ((car.t === "H" || car.t === "HD") && wheelKey === "redondo")
        notas.push("El Button Rally Module no tiene levas de ningún tipo: el embrague va siempre en el pedal VRS, como debe ser en un manual.");

      return { wheel: WHEELS[wheelKey], wheelKey, spring: SPRINGS[springKey], springKey, shift, notas, kg };

    function Spring({ color, dura }) {
      const n = dura ? 7 : 5;
      const h = 120, pad = 14;
      const step = (h - pad * 2) / n;
      let d = `M 30 ${pad}`;
      for (let i = 0; i < n; i++) {
        const y1 = pad + step * i + step / 2;
        const y2 = pad + step * (i + 1);
        d += ` Q ${i % 2 ? 6 : 54} ${y1} 30 ${y2}`;
      }
      return (
        <svg width="60" height={h} viewBox={`0 0 60 ${h}`} aria-hidden="true">
          <rect x="14" y="2" width="32" height="7" rx="2" fill="#3a4250" />
          <rect x="14" y={h - 9} width="32" height="7" rx="2" fill="#3a4250" />
          <path d={d} fill="none" stroke={color} strokeWidth={dura ? 7 : 5} strokeLinecap="round" />
        </svg>
      );
    }

              <>
                <input
                  value={codeInput}
                  onChange={e => setCodeInput(e.target.value.toUpperCase())}
                  onKeyDown={e => e.key === "Enter" && applyCode()}
                  placeholder="ej. XKPQ-847"
                  maxLength={9}
                  style={{ width: 110, background: "#2A313B", border: "1px solid #F2B544", borderRadius: 4, color: "#E8E6E0", padding: "3px 8px", fontSize: 12, fontFamily: "inherit", letterSpacing: 1 }}
                  autoFocus
                />
                <button onClick={applyCode} style={{ ...S.chip, padding: "2px 10px", fontSize: 11, background: "#F2B544", color: "#14171C", borderColor: "#F2B544", fontWeight: 600 }}>usar</button>
                <button onClick={() => { setShowCodeInput(false); setCodeInput(""); }} style={{ ...S.chip, padding: "2px 10px", fontSize: 11 }}>cancelar</button>
              </>
            )}
          </div>

          <div style={S.tabs} role="tablist">
            {[["ir", "iRacing", "2026 S3"], ["ac", "AC EVO", "v0.8"], ["acr", "AC Rally", "v0.4"], ["ams", "AMS2", "v1.6"]].map(([k, t, v]) => (
              <button
                key={k}
                role="tab"
                aria-selected={sim === k}
                onClick={() => { setSim(k); setCat("todas"); setTrans("todas"); setSpring("todas"); setSel(null); }}
                style={{ ...S.tab, ...(sim === k ? S.tabOn : {}) }}
              >
                <span style={{ fontFamily: "'Saira Condensed'", fontSize: 15, fontWeight: 700, letterSpacing: 0.5 }}>{t}</span>
                <span style={{ fontSize: 11, color: sim === k ? "#14171C" : "#8B94A1" }}>{v}</span>
              </button>
            ))}
          </div>

          {sel && rec && (
            <section style={S.card} aria-live="polite">
              <button onClick={() => setSel(null)} style={S.back}>← volver a la lista</button>
              <div style={S.cardCat}>{CATS[sel.cat].label} · {sel.y}</div>
              <h2 style={S.cardTitle}>{sel.n}</h2>
              <p style={S.cardInfo}>{sel.i}</p>

              <div style={S.block}>
                <div style={S.blockLabel}>VOLANTE</div>
                <div style={{ display: "flex", gap: 14, alignItems: "center", marginBottom: 8 }}>
                  {["redondo", "gt3", "formula", "podium"].map((w) => (
                    <div key={w} style={{ textAlign: "center", opacity: rec.wheelKey === w ? 1 : 0.45 }}>
                      <WheelIcon tipo={w} activo={rec.wheelKey === w} />
                      <div style={{ fontSize: 10, color: rec.wheelKey === w ? "#F2B544" : "#8B94A1", marginTop: 2 }}>
                        {WHEEL_LABELS[w]}
                      </div>
                    </div>
                  ))}
                </div>
                <div style={S.blockMain}>{rec.wheel.nombre}</div>
                <div style={S.blockSub}>{rec.wheel.porque}</div>
              </div>

              <div style={S.block}>
                <div style={S.blockLabel}>CAMBIO</div>
                <div style={S.blockMain}>{rec.shift.txt}</div>
                {rec.shift.sub && <div style={S.blockSub}>{rec.shift.sub}</div>}
              </div>

              {sim === "ir" && (() => {
                const gb = gearboxOf(sel);
                return (
                  <div style={S.block}>
                    <div style={S.blockLabel}>CAJA DE CAMBIOS · iRACING</div>
                    <div style={S.blockMain}>{gb.t}</div>
                    <div style={{ ...S.blockSub, marginTop: 4 }}>
                      <strong style={{ color: "#B9C0CB" }}>Accionamiento:</strong> {gb.lever}
                    </div>
                    <div style={S.blockSub}>
                      <strong style={{ color: "#B9C0CB" }}>Subir:</strong> {gb.up}
                    </div>
                    <div style={S.blockSub}>
                      <strong style={{ color: "#B9C0CB" }}>Bajar:</strong> {gb.down}
                    </div>
                    {gb.extra && <div style={{ ...S.blockSub, marginTop: 4, fontStyle: "italic" }}>{gb.extra}</div>}
                  </div>
                );
              })()}

              {(() => {
                const kgKey = `${sim}:${rec.kg}`;
                const userKg = customKg[kgKey];
                const springColor = rec.springKey === "rojo" ? "#D9442E" : "#3D7BD9";
                const handleKgChange = (val) => {
                  const n = parseInt(val, 10);
                  setCustomKg(prev => {
                    const next = { ...prev };
                    if (!val || isNaN(n) || n <= 0) delete next[kgKey];
                    else next[kgKey] = Math.min(n, 300);
                    return next;
                  });
                };
                return (
                  <div style={{ ...S.block, display: "flex", gap: 16, alignItems: "flex-start" }}>
                    <Spring color={springColor} dura={rec.springKey === "rojo"} />
                    <div style={{ flex: 1 }}>
                      <div style={S.blockLabel}>FRENO VRS</div>
                      <div style={{ ...S.blockMain, color: rec.springKey === "rojo" ? "#E8604C" : "#6B9BE3" }}>
                        {rec.spring.nombre}
                      </div>
                      <div style={{ fontSize: 14, fontWeight: 600, margin: "2px 0" }}>
                        Rango sugerido: ~{rec.kg} kg
                        {userKg && <span style={{ color: "#F2B544", fontWeight: 700, marginLeft: 8 }}>· Tu valor: {userKg} kg</span>}
                      </div>
                      <PressureBar range={rec.kg} color={springColor} marker={userKg} />
                      <div style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                        <span style={{ fontSize: 12, color: "#8B94A1" }}>Tu valor para este rango:</span>
                        <input
                          type="number" min="1" max="300"
                          placeholder="kg"
                          value={userKg || ""}
                          onChange={e => handleKgChange(e.target.value)}
                          style={{ width: 62, background: "#2A313B", border: "1px solid #3a4250", borderRadius: 4, color: "#E8E6E0", padding: "3px 7px", fontSize: 13, fontFamily: "inherit" }}
                        />
                        <span style={{ fontSize: 12, color: "#8B94A1" }}>kg</span>
                        {userKg && (
                          <button onClick={() => handleKgChange("")} style={{ background: "none", border: "none", color: "#6b7482", fontSize: 12, cursor: "pointer", padding: 0, fontFamily: "inherit" }}>
                            limpiar
                          </button>
                        )}
                      </div>
                      <div style={{ ...S.blockSub, marginTop: 6 }}>{rec.spring.porque} Calibra el 100 % de freno en el software de VRS a esa fuerza con tu postura real de conducción.</div>
                    </div>
                  </div>
                );
              })()}

              {rec.notas.length > 0 && (
                <div style={S.block}>
                  <div style={S.blockLabel}>NOTAS DE BOXES</div>
                  {rec.notas.map((nt, i) => (
                    <div key={i} style={{ ...S.blockSub, marginBottom: 6, paddingLeft: 12, borderLeft: "2px solid #F2B544" }}>{nt}</div>
                  ))}
                </div>
              )}
            </section>
          )}

          {!sel && (
            <>
              <input
                style={S.search}
                placeholder={`Buscar entre ${data.length} carros…`}
                value={q}
                onChange={(e) => setQ(e.target.value)}
                aria-label="Buscar carro"
              />
              <div className="chipbar">
                <button onClick={() => setCat("todas")} style={{ ...S.chip, ...(cat === "todas" ? S.chipOn : {}) }}>Todas</button>
                {cats.map((k) => (
                  <button key={k} onClick={() => setCat(k)} style={{ ...S.chip, ...(cat === k ? S.chipOn : {}) }}>
                    {CATS[k].label}
                  </button>
                ))}
              </div>
              <div className="chipbar" style={{ marginTop: 2 }}>
                {[["todas", "Cualquier cambio"], ["levas", "Levas"], ["sec", "Secuencial palanca"], ["h", "Palanca en H"], ["sin", "Sin cambios"]].map(([k, t]) => (
                  <button key={k} onClick={() => setTrans(k)} style={{ ...S.chip, ...(trans === k ? S.chipTrans : {}) }}>
                    {t}
                  </button>
                ))}
              </div>
              <div className="chipbar" style={{ marginTop: 2 }}>
                <button onClick={() => setSpring("todas")} style={{ ...S.chip, ...(spring === "todas" ? S.chipTrans : {}) }}>Cualquier resorte</button>
                <button onClick={() => setSpring("rojo")} style={{ ...S.chip, ...(spring === "rojo" ? { background: "#D9442E", color: "#fff", borderColor: "#D9442E", fontWeight: 600 } : {}) }}>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
                    <span style={{ width: 8, height: 8, borderRadius: "50%", background: spring === "rojo" ? "#fff" : "#D9442E", flexShrink: 0 }} />
                    Resorte rojo (duro)
                  </span>
                </button>
                <button onClick={() => setSpring("azul")} style={{ ...S.chip, ...(spring === "azul" ? { background: "#3D7BD9", color: "#fff", borderColor: "#3D7BD9", fontWeight: 600 } : {}) }}>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
                    <span style={{ width: 8, height: 8, borderRadius: "50%", background: spring === "azul" ? "#fff" : "#3D7BD9", flexShrink: 0 }} />
                    Resorte azul (blando)
                  </span>
                </button>
              </div>

              <div role="list">
                {lista.map((x) => {
                  const r = recomendar(x);
                  return (
                    <button key={x.n} className="row" role="listitem" onClick={() => { setSel(x); window.scrollTo({ top: 0 }); }} style={S.row}>
                      <span style={{ ...S.dot, background: r.springKey === "rojo" ? "#D9442E" : "#3D7BD9" }} aria-hidden="true" />
                      <span style={{ flex: 1, textAlign: "left" }}>
                        <span style={S.rowName}>{x.n}</span>
                        <span style={S.rowMeta}>{CATS[x.cat].label} · {x.y} · {WHEEL_LABELS[x.w || CATS[x.cat].w]}</span>
                      </span>
                      <span style={S.rowArrow}>›</span>
                    </button>
                  );
                })}
                {lista.length === 0 && (
                  <div style={{ color: "#8B94A1", padding: 24, textAlign: "center", fontSize: 14 }}>
                    Ningún carro coincide. Prueba otra búsqueda o cambia de categoría.
                  </div>
                )}
              </div>

              <footer style={S.footer}>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 6, marginRight: 14 }}>
                  <span style={{ ...S.dot, background: "#3D7BD9" }} /> azul = resorte blando
                </span>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                  <span style={{ ...S.dot, background: "#D9442E" }} /> rojo = resorte duro
                </span>
                <div style={{ marginTop: 10 }}>
                  Listas actualizadas a junio 2026 · iRacing 2026 S3 · AC EVO v0.8 · AC Rally v0.4 · AMS2 v1.6 (por clases)
                </div>
              </footer>
            </>
          )}
        </div>
      );
    }

    const S = {
      root: { minHeight: "100vh", background: "#14171C", color: "#E8E6E0", fontFamily: "'IBM Plex Sans', sans-serif", padding: "0 14px 40px", maxWidth: 760, margin: "0 auto" },
      header: { padding: "22px 0 4px" },
      flag: { display: "flex", width: 64, height: 8, border: "1px solid #3a4250", marginBottom: 10 },
      flagSq: { flex: 1 },
      h1: { fontFamily: "'Saira Condensed', sans-serif", fontWeight: 700, fontSize: 42, letterSpacing: 6, margin: 0, lineHeight: 1 },
      sub: { color: "#8B94A1", fontSize: 13, margin: "6px 0 0" },
      tabs: { display: "flex", gap: 8, margin: "18px 0 14px" },
      tab: { flex: 1, background: "#1C2128", border: "1px solid #2A313B", borderRadius: 6, color: "#E8E6E0", padding: "10px 0 8px", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 0 },
      tabOn: { background: "#F2B544", color: "#14171C", borderColor: "#F2B544" },
      search: { width: "100%", background: "#1C2128", border: "1px solid #2A313B", borderRadius: 6, color: "#E8E6E0", padding: "11px 14px", fontSize: 15, marginBottom: 10, fontFamily: "inherit" },
      chip: { background: "#1C2128", border: "1px solid #2A313B", borderRadius: 999, color: "#B9C0CB", padding: "6px 13px", fontSize: 13, whiteSpace: "nowrap", cursor: "pointer", fontFamily: "inherit" },
      chipOn: { background: "#E8E6E0", color: "#14171C", borderColor: "#E8E6E0", fontWeight: 600 },
      chipTrans: { background: "#F2B544", color: "#14171C", borderColor: "#F2B544", fontWeight: 600 },
      row: { width: "100%", display: "flex", alignItems: "center", gap: 12, background: "#1C2128", border: "1px solid #2A313B", borderRadius: 6, padding: "11px 14px", marginTop: 8, cursor: "pointer", color: "#E8E6E0", fontFamily: "inherit", transition: "background .15s" },
      dot: { width: 9, height: 9, borderRadius: "50%", flexShrink: 0 },
      rowName: { display: "block", fontSize: 15, fontWeight: 500, lineHeight: 1.3 },
      rowMeta: { display: "block", fontSize: 11.5, color: "#8B94A1", marginTop: 2 },
      rowArrow: { color: "#4a5260", fontSize: 20 },
      card: { background: "#1C2128", border: "1px solid #2A313B", borderRadius: 8, padding: "16px 16px 8px", marginBottom: 16 },
      back: { background: "none", border: "none", color: "#F2B544", fontSize: 13, cursor: "pointer", padding: 0, marginBottom: 10, fontFamily: "inherit" },
      cardCat: { fontFamily: "'Saira Condensed', sans-serif", fontSize: 13, letterSpacing: 2, color: "#F2B544", textTransform: "uppercase" },
      cardTitle: { fontFamily: "'Saira Condensed', sans-serif", fontSize: 28, fontWeight: 700, margin: "2px 0 8px", lineHeight: 1.1 },
      cardInfo: { color: "#B9C0CB", fontSize: 14, lineHeight: 1.55, margin: "0 0 16px" },
      block: { borderTop: "1px solid #2A313B", padding: "13px 0" },
      blockLabel: { fontFamily: "'Saira Condensed', sans-serif", fontSize: 12, letterSpacing: 3, color: "#8B94A1", marginBottom: 4 },
      blockMain: { fontSize: 16, fontWeight: 600, marginBottom: 3 },
      blockSub: { fontSize: 13, color: "#9aa3b0", lineHeight: 1.5 },
      footer: { marginTop: 28, fontSize: 12, color: "#6b7482", lineHeight: 1.6 },
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
