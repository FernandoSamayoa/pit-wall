<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIT WALL — Configurador de rig</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <style>
    body { margin: 0; background: #14171C; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // ---- Firebase ----
    // Config se carga en runtime desde /api/config (las keys viven en variables de entorno de Vercel)
    let CONFIGS = null;

    function genSyncCode() {
      const a = Math.random().toString(36).slice(2, 6).toUpperCase();
      const b = String(Math.floor(Math.random() * 900) + 100);
      return `${a}-${b}`;
    }

    /* ============================================================
       PIT WALL — Selector de configuración del rig
       Hardware: Pedales VRS Pro (resorte azul/rojo) · Fanatec
       Volantes: Redondo 332mm+Button Rally Module · CSL GT3 · Formula 2.5X · Podium 330mm
       Palanca Fanatec H/secuencial
       Listas: iRacing 2026 S3 · AC EVO v0.8
       ============================================================ */

    // ---- Códigos de transmisión ----
    // L = levas · S = secuencial (palanca) · H = palanca en H
    // HD = H dogleg · N = sin cambios / directo · A = automático

    const CATS = {
      formula:   { label: "Fórmula",        w: "formula", s: "rojo", kg: "110–140" },
      proto:     { label: "Prototipos",     w: "formula", s: "rojo", kg: "100–130" },
      gt3:       { label: "GT3",            w: "gt3", s: "rojo", kg: "85–110" },
      gt4:       { label: "GT4",            w: "gt3", s: "rojo", kg: "75–100" },
      gte:       { label: "GTE",            w: "gt3", s: "rojo", kg: "90–120" },
      gt2:       { label: "GT2",            w: "gt3", s: "rojo", kg: "90–120" },
      gt1:       { label: "GT1 / clásicos GT", w: "gt3", s: "rojo", kg: "90–120" },
      copa:      { label: "Copas monomarca",w: "gt3", s: "rojo", kg: "85–110" },
      tcr:       { label: "TCR / Turismos", w: "gt3", s: "azul", kg: "55–70" },
      supercars: { label: "Supercars / Stock Car", w: "redondo", s: "rojo", kg: "90–120" },
      calle:     { label: "Calle",          w: "redondo", s: "azul", kg: "60–70" },
      hiper:     { label: "Superdeportivos",w: "podium", s: "azul", kg: "55–70" },
      clasico:   { label: "Clásicos",       w: "redondo", s: "azul", kg: "55–70" },
      rally:     { label: "Rally / Rallycross", w: "redondo", s: "azul", kg: "60–70" },
      nascar:    { label: "NASCAR / Óvalo", w: "redondo", s: "azul", kg: "45–60" },
      dirt:      { label: "Dirt Oval",      w: "redondo", s: "azul", kg: "35–50" },
      offroad:   { label: "Off-Road",       w: "redondo", s: "azul", kg: "50–65" },
    };

    const c = (n, cat, y, t, i, o) => ({ n, cat, y, t, i, ...(o || {}) });

    const IRACING = [
      // ---------- FÓRMULA ----------
      c("Mercedes-AMG W13 E Performance", "formula", 2022, "L", "Recién salido del Campeonato Mundial de Pilotos 2022, el Mercedes-AMG F1 W13 E Performance es el segundo carro del equipo Mercedes-AMG Petronas en llegar a iRacing. Vestido de plata, en un retorno a los colores tradicionales de la marca alemana, representó un cambio drástico frente a su antecesor el W12 por los grandes cambios de reglamento respecto a 2021. Su rasgo visual más llamativo son los pontones mucho más pequeños. Aunque no fue tan dominante como el W12, debutó en el podio en Baréin con Lewis Hamilton, y George Russell logró su primer podio dos fechas después en Australia. El carro encontró su ritmo tras las mejoras de España, con al menos un podio en siete de las siguientes ocho carreras. Cerró la temporada con un 1-2 en Brasil, donde Russell consiguió su primera victoria en un Gran Premio. En total: 17 podios y seis vueltas rápidas en 22 eventos."),
      c("Mercedes-AMG W12", "formula", 2021, "L", "El equipo Mercedes-AMG Petronas de Fórmula 1 ha sido el más dominante del mundo durante buena parte de la última década, ganando siete Campeonatos de Pilotos y de Constructores al hilo entre 2014 y 2020 gracias al trabajo conjunto de Lewis Hamilton, Nico Rosberg, Valtteri Bottas y George Russell. Para la temporada 2021, la última antes de la revisión total del reglamento, el equipo presentó el F1 W12 E Performance como su siguiente heredero al trono. Impulsado por un V6 híbrido de 1.6 litros capaz de superar los 1.000 caballos, el carro fue una evolución del dominante W11, que había ganado todas las carreras menos cuatro el año anterior. El W12 ganó con Hamilton en su debut en Baréin y se llevó tres de sus primeras cuatro salidas, además de llevar a Hamilton a su victoria número 100 en un apasionante Gran Premio de Rusia que vio caer la lluvia en las vueltas finales."),
      c("McLaren MP4-30", "formula", 2015, "L", "Entre los carros de carreras más avanzados jamás creados, el McLaren MP4-30 es impulsado por un Honda RA615H híbrido. La potencia que produce de forma convencional el V6 turbo de inyección directa de 1.6 litros se complementa con el Sistema de Recuperación de Energía (ERS), que recolecta energía térmica del turbo y de los frenos y entrega empuje adicional a través de la Unidad Motor-Generador. No menos innovador es el chasis del MP4-30, con una exagerada forma de \"botella de Coca-Cola\" alrededor del motor y la transmisión que favorece el flujo de aire hacia el difusor y los alerones traseros, y que como todo F1 actual usa el DRS al seguir de cerca a otro carro. Gracias al acceso sin precedentes a los archivos CAD y datos de McLaren, iRacing rediseñó su modelo de motor para incorporar el ERS y la MGU junto con el almacenamiento y consumo de energía, y creó zonas de adelantamiento para el DRS."),
      c("Super Formula SF23 (Toyota / Honda)", "formula", 2023, "L", "Debutando en la temporada 2023 de Super Formula, el SF23 es el tercer monoplaza desarrollado por el fabricante italiano Dallara para la máxima categoría japonesa de monoplazas. En lo visual, el SF23 evoluciona respecto a su antecesor con una nueva aerodinámica diseñada para generar más adelantamientos. En sostenibilidad, el nuevo diseño reduce en 75 % las emisiones de dióxido de carbono en materias primas y fabricación gracias a nuevos materiales naturales, mientras que los neumáticos Yokohama usan muchas más materias primas renovables manteniendo el rendimiento. Los Super Formula usan motores I4 turbo de 2.0 litros de alto rendimiento fabricados por Honda o Toyota, cada uno capaz de producir más de 550 caballos. Todos llevan un sistema push-to-pass que permite hasta 200 segundos de consumo adicional de combustible por carrera."),
      c("Super Formula Lights", "formula", 2023, "L", "Super Formula Lights es el último escalón que enfrentan los pilotos en la escalera de la Super Formula antes de llegar a la categoría mayor. Con una historia de tomar como base los reglamentos globales de Fórmula 3, desde 2024 la serie usa la más reciente incorporación de Dallara a uno de los portafolios de monoplazas más impresionantes de la historia. Conocido como Dallara 324, el carro actual sucede al modelo 320 que la serie usó durante los cuatro años previos. Además de las mejoras de chasis y aerodinámica, estrena el primer motor único en la historia de la categoría: un Toyota TGE33 turbo de tres cilindros y 1.6 litros desarrollado por TOM'S, capaz de producir unos 275 caballos. Es el mismo calibre de maquinaria por el que pasan los mejores jóvenes del mundo en su ascenso: no lo subestimes."),
      c("Dallara IR18 (IndyCar)", "formula", 2018, "L", "El monoplaza de última generación del automovilismo estadounidense, el Dallara IR18 INDYCAR, fue diseñado no solo para verse mejor en pista, sino también para mejorar las carreras. Todos los carros de la serie compiten con el mismo kit aerodinámico, diseñado y fabricado por Dallara, sin importar el fabricante de motor que elijan. Esto genera carreras más cerradas, más oportunidades de adelantamiento en pista y carreras más emocionantes en general. Cuenta con dos paquetes aerodinámicos claramente distintos: uno de baja carga para superóvalos como Indianápolis y otro de alta carga para circuitos callejeros y ruteros. Bajo el capó, la planta motriz sigue siendo un V6 turbo de 2.2 litros que produce más de 700 caballos.", { notas: ["En óvalos casi no se frena; en circuito la frenada es muy dura y sin ABS."] }),
      c("Dallara F3", "formula", 2019, "L", "El Dallara F3 compite en una de las categorías más exitosas del mundo: la Fórmula 3. Es una serie de desarrollo para pilotos en ascenso en Europa, Estados Unidos, Asia y Australia, y ha visto a muchos pilotos de alto perfil dar el salto a los primeros puestos del automovilismo de monoplazas en la Fórmula 1. Al competir en series de especificación única, el F3 fue diseñado para que los pilotos jóvenes fueran subiendo escalones dentro de los monoplazas. Correr un F3 suele ser la primera incursión en el automovilismo de nivel profesional para los jóvenes amateurs."),
      c("FIA F4", "formula", 2016, "L", "El FIA F4 fue desarrollado en conjunto con el esfuerzo global por aumentar masivamente la participación en el automovilismo a nivel mundial. Tras la introducción en 2022 de una segunda generación de fórmula de acceso a los monoplazas, el FIA F4 se beneficia del mismo nivel de análisis, detalle, datos y pruebas que nuestros miembros esperan, mientras que su modelo genérico permite el uso por parte de clubes nacionales de todo el mundo sin conflictos entre fabricantes."),
      c("Dallara iR-01", "formula", 1991, "L", "El Dallara iR-01 es la respuesta de iRacing y Dallara a los retos del automovilismo internacional de monoplazas de máximo nivel. Diseñado para mezclar los mejores elementos del pasado, el presente y el futuro de las carreras de grand prix, esta máquina rápida y ágil es fácil de tomarle el gusto, pero su electrónica y ayudas limitadas la hacen difícil de dominar. El iR-01 usa un V10 atmosférico de 3.0 litros que recuerda a los motores que dominaron el deporte a principios y mediados de los años 90. Produce más de 900 caballos con un peso en seco de apenas 600 kilos, lo que da como resultado un carro agresivo que corre muy bien en tráfico y que es puro vértigo al manejar."),
      c("Dallara IL-15 (Indy NXT)", "formula", 2015, "L", "La serie hoy conocida como INDY NXT debutó en 2002 como categoría de ascenso de la entonces Indy Racing League, y adoptó su nombre actual en 2023 cuando fue adquirida por Penske Entertainment. Se ha vuelto muy efectiva graduando pilotos hacia la NTT INDYCAR Series: el futuro campeón Josef Newgarden y las estrellas Patricio O'Ward y Kyle Kirkwood usaron títulos de INDY NXT como trampolín. El arma elegida de INDY NXT es el Dallara IL-15. Presentado en 2015, entrega 450 caballos de base (más 50 adicionales con push-to-pass) desde un cuatro cilindros en línea turbo de 2.0 litros. Recibió actualizaciones en 2021, incluyendo el halo de seguridad y una nueva puesta a punto de motor por AER para completar una temporada entera sin reconstrucción. La última actualización llegó en 2023, cuando Firestone tomó el rol de proveedor de neumáticos."),
      c("Formula Renault 2.0", "formula", 2014, "L", "Tras su debut en el año 2000, la Formula Renault 2.0 fue un trampolín vital hacia los niveles más altos del automovilismo de monoplazas para figuras como Lewis Hamilton, Kimi Räikkönen, Felipe Massa, Valtteri Bottas, Daniel Ricciardo y Romain Grosjean. Con chasis de especificación única, motor Renault F4R de 210 caballos y topes de presupuesto, la Formula Renault puso el énfasis en la habilidad del piloto y resultó ser una popular serie nacional en Europa, Sudamérica y Asia a lo largo de los años. Las tres principales series de Formula Renault 2.0 fueron la Eurocup Formula Renault 2.0, la Formula Renault 2.0 Asia y la Formula Renault NEC en el norte de Europa."),
      c("Formula Renault 3.5", "formula", 2014, "L", "El hermano (mucho) mayor de la Formula Renault 2.0, el FR3.5 encaja perfecto en el sistema de escalera de monoplazas de iRacing. Estos carros de cabina abierta y motor V8 fueron tradicionalmente un peldaño para muchos pilotos que perseguían una carrera en la Fórmula 1. Con chasis y motor de especificación única, permitían a los pilotos lucir sus habilidades y, con suerte, ser vistos por un equipo de Fórmula 1. Los V8 atmosféricos producen 530 caballos, y los grandes alerones delantero y trasero aportan enormes cantidades de carga aerodinámica y agarre. Hay quienes dicen que el FR3.5 suena como debería sonar un Fórmula 1, o al menos como sonaba antes de pasar a las unidades de potencia turbo-híbridas."),
      c("Dallara DW12 / IR-05 (Legacy)", "formula", 2012, "L", "Nombrado en honor al fallecido Dan Wheldon, quien realizó su desarrollo inicial, el Dallara DW12 es el chasis único que se corrió en las series estadounidenses de monoplazas de 2012 a 2017. Dallara fue elegida como proveedora de chasis por un panel de pilotos, diseñadores, promotores y administradores como parte del Plan ICONIC (Innovador, Competitivo, Open-wheel, Nuevo, relevante para la Industria y Costo-efectivo). Siguiendo esos principios, el DW12 incorpora una serie de características diseñadas para mejorar tanto la competencia como la seguridad, incluyendo ruedas traseras parcialmente cubiertas, una barra de protección y una construcción robusta del alerón delantero. Chevrolet y Honda proveen motores V6 turbo de 2.2 litros que producen hasta 700 caballos y cuentan con push-to-pass en circuitos ruteros y callejeros seleccionados."),
      c("USF2000 (Tatuus USF-17)", "formula", 2017, "L", "El Tatuus USF-17 es el carro oficial del Cooper Tires USF2000 Championship, el primer escalón de la escalera Road to Indy. Casa temprana de la mayoría de las estrellas de la generación actual de IndyCar, el USF2000 actual equipa a los pilotos con 175 caballos mientras hacen la transición desde los karts u otras formas de automovilismo de desarrollo. Al compartir un chasis común con otros niveles del Road to Indy, el carro tiene ciertas áreas que pueden mejorarse conforme los pilotos avanzan de categoría, lo que representa un enorme ahorro de costos para los equipos y permite a los pilotos familiarizarse a fondo con los matices del automovilismo de monoplazas sin tener que adaptarse repetidamente a máquinas totalmente distintas."),
      c("Pro Mazda (Star Mazda)", "formula", 2013, "S", "El Pro Mazda de segunda generación, con su bañera de fibra de carbono, suspensión y paquete aerodinámico totalmente ajustables, caja secuencial de seis velocidades y el fiabilísimo motor rotativo Mazda Renesis de 240 caballos, es el monoplaza de acceso perfecto. No debería sorprender entonces que la Pro Mazda Series haya producido un montón de jóvenes estrellas, desde los pilotos de Indy car Marco Andretti y Graham Rahal hasta el veterano de Fórmula 1 Scott Speed, la estrella de IMSA Colin Braun y el piloto de la NASCAR Cup Michael McDowell. Con un peso en seco de 517 kilos y una relación peso-potencia de 1:5, un Pro Mazda acelera de 0 a 96 km/h en menos de tres segundos y alcanza más de 241 km/h. Como es una serie de especificación única, los presupuestos son razonables, pero mientras el motor sellado significa la misma potencia para todos, los jóvenes pilotos y sus ingenieros tienen la oportunidad de dominar la ciencia crítica de la puesta a punto del chasis.", { s: "azul" }),
      c("Williams-Toyota FW31", "formula", 2009, "L", "Williams está entre los equipos más exitosos de la historia de la Fórmula 1. Desde que Sir Frank Williams fundó Williams Grand Prix Engineering en 1977, el equipo ha ganado Campeonatos Mundiales de Pilotos con Alan Jones, Keke Rosberg, Nelson Piquet, Nigel Mansell, Alain Prost, Damon Hill y Jacques Villeneuve, junto con nueve Campeonatos de Constructores en sociedad con Cosworth, Honda y Renault. El Williams-Toyota FW31 se basa en un monocasco compuesto de carbono-aramida y nido de abeja, con un paquete aerodinámico que incorpora un doble difusor en la parte trasera. La suspensión delantera usa dobles horquillas de fibra de carbono con resortes accionados por push-rod y geometría de quilla cero. Lo impulsa un V8 Toyota RVX-09 atmosférico de 2.4 litros montado longitudinalmente, limitado a 18.000 rpm y con una potencia estimada de 740 caballos. La potencia llega a las ruedas traseras mediante una transmisión Williams semiautomática de siete velocidades con accionamiento electrohidráulico y cambio sin corte."),
      c("Indy Pro 2000 PM-18", "formula", 2018, "L", "El Tatuus PM-18 es el carro oficial de la Indy Pro 2000 Series, el segundo escalón de la escalera Road to Indy. Presentado en 2018, el nuevo carro estableció 10 récords de pista distintos en su segunda temporada y se mantendría como pilar del campeonato al menos hasta 2024, convirtiéndolo en un carro definitorio en la trayectoria de futuros campeones de las 500 Millas de Indianápolis. Al compartir un chasis común con otros niveles del Road to Indy, el carro tiene ciertas áreas que pueden mejorarse conforme los pilotos avanzan de categoría, lo que representa un enorme ahorro de costos para los equipos y permite a los pilotos familiarizarse a fondo con los matices del automovilismo de monoplazas sin tener que adaptarse repetidamente a máquinas totalmente distintas."),
      c("Formula Vee — Classic", "formula", 1963, "H", "¡Una de las fórmulas juveniles de monoplazas más legendarias es parte de iRacing! El Formula Vee se basa en las piezas de serie de un Volkswagen Beetle anterior a 1963, combinándolas con un chasis tubular y una carrocería de monoplaza en fibra de vidrio o fibra de carbono. Parte de los SCCA Runoffs desde 1964, estos carros también han demostrado ser muy populares en todo el mundo, con nombres icónicos como Niki Lauda y Keke Rosberg iniciando sus carreras en estas veteranas máquinas.", { w: "redondo", s: "azul" }),
      c("Formula Vee — Sabre", "formula", 2026, "H", "¡Una de las fórmulas juveniles de monoplazas más legendarias es parte de iRacing! El Formula Vee se basa en las piezas de serie de un Volkswagen Beetle anterior a 1963, combinándolas con un chasis tubular y una carrocería de monoplaza en fibra de vidrio o fibra de carbono. Parte de los SCCA Runoffs desde 1964, estos carros también han demostrado ser muy populares en todo el mundo, con nombres icónicos como Niki Lauda y Keke Rosberg iniciando sus carreras en estas veteranas máquinas.", { w: "redondo", s: "azul" }),
      c("Formula Vee — Conqueror", "formula", 2026, "H", "¡Una de las fórmulas juveniles de monoplazas más legendarias es parte de iRacing! El Formula Vee se basa en las piezas de serie de un Volkswagen Beetle anterior a 1963, combinándolas con un chasis tubular y una carrocería de monoplaza en fibra de vidrio o fibra de carbono. Parte de los SCCA Runoffs desde 1964, estos carros también han demostrado ser muy populares en todo el mundo, con nombres icónicos como Niki Lauda y Keke Rosberg iniciando sus carreras en estas veteranas máquinas.", { w: "redondo", s: "azul" }),
      c("Skip Barber Formula 2000", "formula", 2000, "S", "Como el monoplaza usado en todos los campeonatos de las Skip Barber Race Series, el Skip Barber Formula 2000 ha jugado un papel vital en el lanzamiento de las carreras de pilotos como A.J. Allmendinger, Marco Andretti, Juan Pablo Montoya, Jeff Gordon, Todd Bodine y Kasey Kahne. Con un peso de apenas 567 kilos, el Skip Barber Formula 2000 de chasis tubular usa un motor Dodge de cuatro cilindros y 150 caballos. Esta planta motriz de 2.0 litros y árbol de levas simple en cabeza va acoplada a una caja secuencial de cinco velocidades. La relación peso-potencia resultante permite velocidades de hasta 217 km/h, aceleración de 0 a 96 km/h en 4.5 segundos y hasta 160 km/h en menos de 10 segundos.", { s: "azul" }),
      c("Ray FF1600", "formula", 2019, "H", "Durante más de medio siglo, la británica Ray Race Cars ha construido monoplazas de acceso que han lanzado las carreras de incontables estrellas del automovilismo. Pero pocos carros de ese nivel se acercan al lugar que ocupa en la cultura del motor la fórmula FF1600, presente desde finales de los años 60, cuando las escuelas de manejo buscaban una fórmula asequible para que los aspirantes a piloto de grand prix pudieran practicar. La característica que más distingue al FF1600 frente a otras fórmulas juveniles es su ausencia de alerones; sin esa carga aerodinámica para trabajar junto al motor de 1.6 litros, estos carros exigen mucho más cuidado en las curvas que sus rivales con alas, pero también suelen ir muy parejos en pista y con muchos adelantamientos. Súmale un reglamento relativamente abierto y un chasis tubular, y el FF1600 es popular en todo el mundo como una forma accesible de correr en monoplazas.", { w: "redondo", s: "azul" }),
      c("Lotus 79", "clasico", 1978, "H", "\"Si se ve rápido, lo más probable es que sea rápido.\" En el caso del Lotus 79, nunca se dijeron palabras más ciertas. Entre los carros de carreras más elegantes jamás construidos, el Lotus 79 también figura entre los más exitosos, llevando a Mario Andretti y Ronnie Peterson a seis victorias camino al Campeonato de Constructores de 1978 para Lotus y al Campeonato Mundial de Pilotos para Andretti. Más allá de sus victorias y del título, su diseño de efecto suelo lo distingue como uno de los carros más influyentes de la historia. El Lotus 79 fue el sucesor lógico del revolucionario Lotus 78, el primer carro en usar el \"efecto suelo\" acelerando el aire que fluía bajo sus pontones en forma de venturi para crear niveles de carga aerodinámica antes inimaginables. Aunque el 78 ganó carreras, el 79 llevó el efecto suelo al siguiente nivel con pontones rediseñados y una suspensión trasera revisada para maximizar el flujo de aire.", { notas: ["Volante pequeño y redondo como el real: el aro redondo es el más fiel."] }),
      c("Lotus 49", "clasico", 1967, "H", "El Lotus 49 está entre los carros más significativos y queridos de la historia de la Fórmula 1. Su relevancia técnica viene de que, cuando fue presentado en 1967, fue el primer Fórmula 1 exitoso en usar el motor como componente estructural totalmente sometido a esfuerzos dentro del chasis. ¡Y qué motor! Colin Chapman y Maurice Philippe diseñaron el Lotus 49 alrededor del nuevo Ford-Cosworth DFV, que se convertiría en uno de los motores más ganadores de la historia del automovilismo. Pero el apego emocional de los aficionados al Lotus 49 va más allá del aprecio por su chasis revolucionario y su prolífico motor. En el debut del carro, los compañeros de equipo Jim Clark y Graham Hill dominaron el Gran Premio de los Países Bajos de 1967, con Hill logrando la pole y Clark la victoria. Clark sumaría tres victorias más esa temporada, las últimas de su carrera trágicamente interrumpida, mientras que Hill capturó su segundo Campeonato Mundial con un Lotus 49B al año siguiente."),

      // ---------- PROTOTIPOS ----------
      c("BMW M Hybrid V8 (GTP) — Evo 2026", "proto", 2023, "L", "El tan esperado regreso de BMW a las filas más altas de los prototipos llegó en 2023, cuando el fabricante alemán trajo el BMW M Hybrid V8 al IMSA WeatherTech SportsCar Championship. Construido bajo un nuevo conjunto de reglas globales para prototipos, el carro original debutó en iRacing antes de dar su primera vuelta de competencia en el mundo real. Para 2026, el carro recibió una actualización Evo antes de ser puesto en manos del nuevo equipo oficial de BMW, Team WRT. Años de esfuerzos coordinados en Norteamérica y Europa para crear un reglamento unificado de máximo nivel permitieron que los grandes fabricantes regresaran a los prototipos, con BMW entre los primeros en anunciar su participación. El M Hybrid V8 Evo produce aproximadamente 640 caballos solo con su motor de cuatro litros, y su motor eléctrico puede sumar todavía más empuje. La variante Evo incluye actualizaciones extensas de aerodinámica y una arquitectura de faros rediseñada para mejor visión nocturna."),
      c("Porsche 963 GTP", "proto", 2023, "L", "Tras una pausa de cinco años en los prototipos de máximo nivel, Porsche regresó a la disciplina en 2023 con el flamante 963 para la clase GTP del IMSA WeatherTech SportsCar Championship. En alianza con Multimatic para construir el chasis, el 963 hizo su debut de competencia en las 24 Horas de Daytona de 2023 con Porsche Penske Motorsport, y más equipos han ido adoptando el carro alrededor del mundo conforme avanzó la temporada. Mathieu Jaminet y Nick Tandy, de Penske, le dieron al carro su primera victoria en Long Beach, en su tercera salida de la temporada de IMSA. Impulsado por el V8 biturbo de 4.6 litros de Porsche, el motor 9RD que mueve al 963 entrega más de 670 caballos. Como los demás carros GTP, pesa 1.030 kilos y cuenta con un sistema híbrido de especificación única de 50 kW."),
      c("Cadillac V-Series.R GTP", "proto", 2023, "L", "El Cadillac V-Series.R es la más reciente entrada de prototipo de máximo nivel de General Motors para la competencia deportiva global. Construido bajo el reglamento universal Le Mans Daytona h que debutó en la temporada 2023, el V-Series.R se lanzó tanto en el IMSA WeatherTech SportsCar Championship, con unidades de Chip Ganassi Racing y Action Express Racing, como internacionalmente con otro equipo dirigido por Ganassi. El Cadillac V-Series.R sucede al Cadillac DPi-V.R, que logró cinco victorias consecutivas en las 24 Horas de Daytona entre 2017 y 2021. Impulsado por un V8 de 5.5 litros, el V-Series.R tiene el motor más grande de todos los carros que compiten en la clase GTP. Consiguió su primera victoria en IMSA en las 12 Horas de Sebring de 2023 con Alexander Sims, Pipo Derani y Jack Aitken al volante, recuperándose de un incidente temprano y sobreviviendo una carrera de desgaste."),
      c("Acura ARX-06 GTP", "proto", 2023, "L", "Construido conforme al nuevo reglamento GTP del IMSA WeatherTech SportsCar Championship, el Acura ARX-06 debutó en las 24 Horas de Daytona de 2023 como reemplazo del ARX-05 que había corrido durante cinco años bajo el conjunto de reglas DPi anterior. Acura continuó su relación previa con el constructor Oreca para construir el nuevo carro, que debutaría en manos de Meyer Shank Racing with Curb-Agajanian y Wayne Taylor Racing with Andretti Autosport; los equipos arrancarían con todo, terminando 1-2 en Daytona. El ARX-06 monta un motor V6 biturbo de 2.4 litros, más pequeño que el de su antecesor pero con un golpe potente de más de 670 caballos. Como los demás carros GTP, pesa 1.030 kilos y cuenta con un sistema híbrido de especificación única de 50 kW."),
      c("Ferrari 499P", "proto", 2023, "L", "Los aficionados a la resistencia de todo el mundo celebraron cuando Ferrari presentó su prototipo 499P a finales de 2022. Después de todo, puso fin a una ausencia de 50 años de prototipos Ferrari oficiales compitiendo al máximo nivel, y la marca celebró su regreso adoptando el 50 como número insignia. El 499P se estableció rápidamente como una fuerza global a tomar en cuenta, ganando Le Mans en su primer intento en 2023 y repitiendo al año siguiente. Como otros prototipos de máximo nivel, el 499P usa un motor híbrido biturbo de 671 caballos. Con apenas 1120 kilos de peso, los pilotos recorren rápidamente su secuencial de siete velocidades con levas para alcanzar la velocidad máxima en rectas largas como las del célebre circuito francés. Cualquier piloto capaz de encontrar los límites del 499P está entre los mejores de los mejores, sea en el mundo real o en el virtual."),
      c("Dallara P217 LMP2", "proto", 2017, "L", "El regreso de Dallara a los prototipos por primera vez desde el Audi R18 TDI original, el P217 debutó en 2017. El carro compite en la clase LMP2 tanto en el Campeonato Mundial de Resistencia de la FIA como en la European Le Mans Series, mientras que una versión con especificación Daytona Prototype International corrió al máximo nivel del IMSA WeatherTech SportsCar Championship con la marca Cadillac hasta que se adoptó la especificación GTP en 2023. El P217 de LMP2 usa un V8 Gibson de 4.2 litros y una transmisión secuencial Xtrac de seis velocidades accionada por levas. Entre los pilotos que lo corrieron en su debut en las 24 Horas de Le Mans estuvieron la leyenda de Fórmula 1 Rubens Barrichello, el excampeón de Le Mans Jan Lammers y el veterano de IndyCar Mikhail Aleshin. Otros veteranos de Fórmula 1 que lo han manejado en Le Mans incluyen a Felipe Nasr, Sergey Sirotkin y Giedo van der Garde."),
      c("Ligier JS P320 (LMP3)", "proto", 2020, "L", "El diseño más reciente de Ligier bajo el reglamento global de LMP3, el Ligier JS P320 se lanzó en el verano de 2019. Sucedió al JS P3 que venía corriendo desde 2015, con cientos de victorias y múltiples campeonatos en series globales e internacionales. Representó cambios importantes frente a su antecesor en carrocería y suspensión, y sumó control de tracción y un motor Nissan V8 nuevo y más potente como parte de una nueva generación del reglamento LMP3. En sus primeras dos temporadas dentro del IMSA WeatherTech SportsCar Championship, los Ligier dominaron la clase LMP3. Riley Motorsports terminó primero y tercero en la tabla de 2021, liderado por el campeón Gar Robinson, mientras que la dupla de CORE Autosport formada por Colin Braun y Jon Bennett fue segunda en esa temporada inaugural antes de ganar el título en 2022. De 2024 en adelante, el JS P320 y el resto de LMP3 compiten exclusivamente en el IMSA VP Racing SportsCar Challenge."),
      c("HPD ARX-01c", "proto", 2010, "L", "El HPD ARX 01c figura entre los prototipos deportivos más rápidos e innovadores jamás construidos. Ganador de la clase LMP2 en las 24 Horas de Le Mans de 2010, el HPD ARX 01c tiene sus raíces en el Acura ARX 01c que logró una histórica victoria de clase en su debut en las 12 Horas de Sebring de 2007 y que después sumó varias victorias absolutas en IMSA frente a los más potentes y (teóricamente) más rápidos LMP1. El chasis del ARX 01c es un monocasco de fibra de carbono con suspensión de doble horquilla y push-rod adelante y atrás, equipado con frenos de pinza de aluminio de seis pistones y discos de carbono. Lo impulsa un V8 de 3.4 litros que produce aproximadamente 480 caballos, transmitidos por una caja semiautomática de seis velocidades. Sumado a la considerable carga aerodinámica que generan sus alerones, flaps y túneles, el ARX 01c es tan ágil como potente."),
      c("Audi R18", "proto", 2016, "L", "El R18 e-tron quattro es un prototipo LMP1 híbrido diésel que compitió en las 24 Horas de Le Mans y en el Campeonato Mundial de Resistencia. Comenzó su vida simplemente como el R18 TDI, un prototipo de propulsión diésel, en 2011. Conforme cambiaron las reglas de la serie, también lo hizo el R18: el carro evolucionó con el tiempo para incorporar tecnología híbrida en forma de KERS (Sistema de Recuperación de Energía Cinética). Como indica su nombre (Quattro), el R18 cuenta con tracción a las cuatro ruedas: las delanteras son impulsadas por un motor eléctrico mientras que las traseras reciben potencia del motor diésel. Es una configuración única que entrega potencia automáticamente a la rueda óptima conforme el carro acelera, funcionando casi como un control de tracción y facilitando el manejo, sobre todo en carreras largas de resistencia donde las condiciones de pista cambian. El R18, en sus distintas formas, ganó cuatro veces las 24 Horas de Le Mans y dos títulos del WEC (2012 y 2013)."),
      c("Porsche 919 Hybrid", "proto", 2017, "L", "El Porsche 919 Hybrid marcó el regreso de Porsche a los prototipos tras el exitoso programa del RS Spyder que terminó en 2011. El 919 debutó en las 6 Horas de Silverstone del Campeonato Mundial de Resistencia (WEC) en 2014 y terminó esa temporada tercero en el campeonato. En 2015, Porsche volvería a la senda del triunfo llevándose la victoria en las 24 Horas de Le Mans y también el campeonato general de la temporada. El Porsche 919 ganaría además Le Mans y el campeonato del WEC en 2016 y 2017. A lo largo de sus cuatro años de competencia en el WEC, muchos pilotos de clase mundial lo llevaron al límite: el piloto de Fórmula 1 Mark Webber y varios reconocidos pilotos oficiales de Porsche como Romain Dumas, Marc Lieb, Timo Bernhard y Nick Tandy, por mencionar algunos. Con 17 victorias en el WEC y tres campeonatos, el Porsche 919 es considerado uno de los LMP1 más exitosos."),
      c("Radical SR8", "proto", 2009, "S", "Fundada en 1997, la británica Radical Motorsport se propuso crear un nicho completamente nuevo en el automovilismo, con el lema de que 'Nada se compara'. La compañía ha evolucionado hasta convertirse en el mayor productor de carros de carrera y de pista del Reino Unido, con más de 2.700 unidades vendidas globalmente en las últimas dos décadas. Cerca de la cima de la gama Radical está el SR8, que consiguió el récord absoluto de vuelta en el legendario Nordschleife de Nürburgring en 2005, marca que se mantuvo imbatida durante 12 años. Con 380 caballos y 599 kilos en seco, el rendimiento de este ágil biplaza es sencillamente asombroso. El motor es una obra maestra de ingeniería: un V8 de 2.6 litros de especificación de competencia, construido a mano, con un límite de giros de 10.500 rpm que entrega una aceleración implacable. La potencia se transmite a través de un embrague AP Racing a un transeje secuencial Powertec de seis velocidades con diferencial autoblocante.", { notas: ["Cambio derivado de moto: la palanca secuencial es lo más inmersivo."] }),
      c("Radical SR10", "proto", 2020, "L", "Fundada en 1997, la británica Radical Motorsport se propuso crear un nicho completamente nuevo en el automovilismo, con el lema de que 'Nada se compara'. La compañía es hoy el mayor productor de carros de carrera y de pista del Reino Unido, representada por una red de 33 concesionarios en 21 países que ofrecen a los clientes una experiencia completa en 12 campeonatos monomarca alrededor del mundo. El SR10 turboalimentado se lanzó a mediados de 2020 y encabeza la gama SR de Radical con más de 425 caballos y 515 Nm de torque para un rendimiento fulminante. Con apenas 725 kilos, su relación peso-potencia lo convierte en una de las máquinas más ágiles y emocionantes imaginables. Un nuevo motor turbo de 2.3 litros construido a mano con especificación de competencia, una transmisión secuencial Hewland de seis velocidades y una alta carga aerodinámica se combinan para entregar un rendimiento cercano al de un LMP2."),
      c("Riley MkXX Daytona Prototype (Legacy)", "proto", 2008, "S", "Riley Technologies figura entre los constructores de chasis deportivos más exitosos de Estados Unidos, y su Riley Mk XX está entre los Daytona Prototype más exitosos de todos. El Riley Mk XX de iRacing usa un V8 Pontiac y una transmisión Xtrac de cinco velocidades, aunque el reglamento de IMSA permite una amplia variedad de marcas y configuraciones de motor, todas limitadas a una potencia similar a la del Pontiac —aproximadamente 500 caballos—, que es más que suficiente para un carro de 1.032 kilos, fondo plano y carga aerodinámica limitada. Hay un amplio rango de ajustes aerodinámicos y mecánicos disponibles para adaptar el comportamiento del Riley a las necesidades de cada piloto en cada pista. El ángulo del alerón trasero es totalmente ajustable, y hay dos opciones de extensiones y dos de wickerbills. La aerodinámica delantera se ajusta mediante la altura al piso y el añadido de pequeños dive planes."),
      c("Chevrolet Corvette C7 Daytona Prototype (Legacy)", "proto", 2014, "L", "Este no es el Daytona Prototype de tu papá. Conocido por mucho tiempo por su apariencia \"excéntrica\", gracias al Corvette C7 el Daytona Prototype ahora encarna aquella vieja máxima del automovilismo: si se ve rápido, es rápido. La carrocería de fibra de carbono del Corvette C7 Daytona Prototype refleja las líneas retraídas y musculosas de su primo de calle, el C7 Stingray. Una sola entrada ancha de radiador en la base del morro incorpora los ductos de freno delanteros, y el tratamiento de faros y calaveras completa los vínculos visuales con el Stingray. La velocidad de este Corvette es más que superficial: el V8 atmosférico de 5.5 litros en posición central desarrolla aproximadamente 600 caballos que se transmiten al diferencial mediante una caja secuencial de seis velocidades. El Corvette usa un chasis de cromo-molibdeno con suspensión de doble horquilla, incluyendo resortes helicoidales sobre amortiguadores accionados por push-rod."),
      c("Nissan GTP ZX-Turbo", "clasico", 1990, "H", "Uno de los carros de carrera más brutalmente rápidos jamás construidos, el Nissan GTP ZX-T fue esa rarísima bestia: un cazador de Porsches y Jaguares. Comenzando con una victoria en la carrera callejera de Miami en el 87, avanzando hasta el título de pilotos del IMSA Camel GT de Geoff Brabham en el 88 y culminando en una temporada del 89 en la que Brabham superó por poco a su compañero Chip Robinson para un segundo título de pilotos mientras capturaba el campeonato de fabricantes, el Nissan GTP ZX-T emergió como la fuerza dominante del automovilismo deportivo norteamericano. Tras usar un chasis Lola como base del primer retador de Nissan en IMSA en 1985, Electramotive Engineering, con sede en El Segundo, California, fue migrando gradualmente hacia la construcción de su propio chasis diseñado por Trevor Harris para alojar el prodigiosamente potente motor turbo VG30ET de Nissan. Siempre rápidos, los Nissan eran frágiles, al menos al principio, pero para el 88 el desarrollo continuo había curado en gran medida los problemas de fiabilidad.", { s: "rojo" }),

      // ---------- GT3 ----------
      c("Ferrari 296 GT3", "gt3", 2023, "L", "La incursión más reciente de Ferrari en las carreras GT3, el 296 GT3 debutó en el IMSA WeatherTech SportsCar Championship y en otros campeonatos globales importantes a tiempo para la temporada 2023. Sucede al 488 GT3 EVO que había debutado en 2020, y fue diseñado para construir sobre los éxitos de aquel carro con modificaciones de puesta a punto más fáciles para el equipo y una carga aerodinámica notablemente mayor que la de su antecesor. Impulsado por un motor V6 igual que su contraparte de calle, el 296 GT3 es capaz de producir 600 caballos desde su planta motriz de 2.9 litros. Cuatro unidades salieron a pista en las clases GTD y GTD Pro de IMSA en su debut en las 24 Horas de Daytona, y el carro consiguió su primera victoria en una carrera de resistencia de doble vuelta al reloj pocos meses después en Nürburgring."),
      c("BMW M4 GT3 Evo", "gt3", 2025, "L", "Presentado en BMW Sim Live en diciembre de 2020, el estreno del BMW M4 GT3 fue un puente entre el mundo virtual y el real, sobre todo porque su volante podía desmontarse del carro real y conectarse directamente a iRacing. El carro tuvo un prelanzamiento en iRacing para dar a los sim racers una probada de lo que venía antes de que empezara a competir en las series GT3 del mundo, y recibió actualizaciones dentro del simulador para igualar su forma final. El BMW M4 GT3 sucedió al BMW Z4 GT3 como el segundo BMW en unirse a la oferta GT3 de iRacing. Lo impulsa un seis en línea biturbo de 3 litros capaz de producir 590 caballos. Marcado por los rasgos de diseño tradicionales de BMW, el M4 GT3 es tan reconocible al instante como cualquiera de sus antecesores, dentro y fuera de la pista. El M4 GT3 EVO, con refinamientos en chasis y aerodinámica, debutó en pista y en iRacing en 2025."),
      c("Porsche 911 GT3 R (992)", "gt3", 2023, "L", "El más reciente de una larga línea de Porsches construidos para el automovilismo deportivo, la edición con especificación 992 del Porsche 911 GT3 R sigue los pasos del GT3 R basado en el 991 que debutó en la temporada 2019. También se suma al modelo actual del Porsche 911 GT3 Cup, que debutó en 2021, como un Porsche de competencia basado en la generación 992. En su temporada inaugural en el IMSA WeatherTech SportsCar Championship, cinco equipos —Pfaff Motorsports, MDK Motorsports, Wright Motorsports, AO Racing Team y Kelly-Moss with Riley— llevaron al menos un 992 a la parrilla entre las divisiones GTD y GTD Pro. El 911 GT3 R (992) usa un motor bóxer de seis cilindros de 4.2 litros, un aumento de cilindrada frente a los 4.0 litros del carro anterior. Su primera victoria en IMSA llegó de la mano del equipo GTD Pro de Pfaff con Klaus Bachler, Patrick Pilet y Laurens Vanthoor en las 12 Horas de Sebring de 2023."),
      c("Porsche 911 GT3 R (991)", "gt3", 2019, "L", "Los GT3 han demostrado ser algunos de los carros de circuito más populares del mundo en los últimos años, y pocas marcas tienen el pedigrí en circuito de Porsche. No debería sorprender, entonces, que el Porsche 911 GT3 R sea a la vez una pieza querida y exitosa. Exitoso de inmediato desde el arranque gracias a una victoria en su primer intento en las 12 Horas de Bathurst, puedes encontrar al 911 GT3 R corriendo al frente del pelotón en todas partes, desde el IMSA WeatherTech SportsCar Championship hasta el Intercontinental GT Challenge. El motor bóxer de seis cilindros de 4.0 litros produce unos contundentes 500 caballos, ¡más que suficientes para impulsarte al frente del grupo!"),
      c("Mercedes-AMG GT3 2020", "gt3", 2020, "L", "Desde su introducción en 2015, el Mercedes-AMG GT3 ha sido uno de los retadores más prominentes del automovilismo deportivo. El carro se llevó cinco de los seis primeros lugares, incluidos los primeros cuatro, en las 24 Horas de Nürburgring en su primer intento, y poco después encontró el éxito con Riley Technologies en los eventos principales del IMSA WeatherTech SportsCar Championship en Daytona y Sebring. Para la temporada 2020, el carro recibió una serie de actualizaciones que incluyeron ajustes aerodinámicos en el splitter delantero y el alerón trasero, además de cambios estéticos para acercarlo más a su contraparte de calle. Se mantiene de su primera iteración la planta motriz V8 de 6.3 litros que produce 550 caballos y la transmisión secuencial de seis velocidades. Ahora, el Mercedes-AMG GT3 completamente actualizado llega a iRacing y es tu oportunidad de probar la siguiente generación del rendimiento alemán en circuito."),
      c("Audi R8 LMS EVO II", "gt3", 2022, "L", "Un pilar de los eventos GT3 alrededor del mundo durante buena parte de la última década, el R8 LMS de Audi recibió su segunda actualización para la temporada 2022 con la llegada del R8 LMS Evo II. Igual que su antecesor, el Evo I, el Evo II puede comprarse nuevo o como kit de actualización para un modelo de generación previa. Las mejoras principales incluyeron un nuevo paquete aerodinámico que genera más carga con el alerón trasero, un nuevo sistema de admisión del motor y amortiguadores ajustables en cuatro vías. El R8 LMS Evo II mostró su ritmo rápidamente en su primera temporada, continuando una larga línea de éxitos de los R8 LMS GT3 en todo el mundo. Entre lo más destacado estuvieron tres de las cuatro vueltas más rápidas en la clasificación de las 12 Horas de Bathurst y la continuación del historial exitoso de la marca en el DTM al conseguir el título de fabricantes de 2022 con tres victorias."),
      c("Lamborghini Huracán GT3 EVO", "gt3", 2019, "L", "Años de herencia deportiva se reúnen en el Lamborghini Huracán GT3 EVO, el retador GT3 más reciente de Lamborghini en las series de automovilismo deportivo de todo el mundo. Desarrollado internamente en Sant'Agata Bolognese por Lamborghini Squadra Corse, el Huracán GT3 EVO construye sobre la fórmula ganadora de su antecesor, el Huracán GT3, con una aerodinámica mejorada desarrollada en conjunto con Dallara y un potente motor V10 de 5.2 litros. 2020 fue un año excepcional para el carro, con un barrido completo de los títulos de pilotos y equipos del IMSA WeatherTech SportsCar Championship, tanto en la tabla de temporada completa como en la de carreras de resistencia, para Paul Miller Racing. Del otro lado del Atlántico, Barwell Motorsport llevó el carro al primer título de Lamborghini en el British GT, mientras que una victoria de clase en las 24 Horas de Spa y múltiples triunfos en el GT World Challenge redondearon una temporada estelar."),
      c("McLaren 720S GT3 EVO", "gt3", 2023, "L", "Desde 2019, el McLaren 720S GT3 se ha demostrado como una de las plataformas GT3 más competitivas del mundo. Ese éxito continuó en 2023 con la llegada del 720S GT3 EVO, que mejoró la aerodinámica, la suspensión, el balance general y otros elementos clave del carro. El 720S GT3 EVO es un popular carro de cliente en todo el mundo. Tras una larga relación con la marca McLaren, tanto en sus concesionarios como en la clase GT4, Pfaff Motorsports llevó el carro a la clase GTD Pro de IMSA por primera vez en la temporada 2024. El equipo consiguió su primer podio con el 720S GT3 EVO en WeatherTech Raceway Laguna Seca en mayo, sumando a la larga historia de McLarens GT3 peleando adelante en todo el mundo."),
      c("Ford Mustang GT3", "gt3", 2024, "L", "El Ford Mustang de séptima generación ha sido el eje de los esfuerzos deportivos modernos de Ford alrededor del mundo, desde la NASCAR Cup Series hasta la serie Supercars de Australia. No fue sorpresa, entonces, que el Óvalo Azul revelara que volvería al IMSA WeatherTech SportsCar Championship por primera vez desde 2019 con el Mustang GT3, basado en el modelo Mustang Dark Horse 2024. El Ford Mustang GT3 usa un motor V8 Ford Coyote atmosférico de 5.4 litros. Construido y competido por Multimatic en la clase GTD Pro, y usado como carro de cliente por Proton Competition tanto en GTD como en series GT3 internacionales, el carro también marca la primera vez desde 1997 que un Mustang compite en Le Mans. Con excampeones de Le Mans como Mike Rockenfeller y Joey Hand reclutados para el programa oficial de IMSA, las expectativas son altas mientras la marca escribe el siguiente capítulo del legado deportivo del Mustang."),
      c("Chevrolet Corvette Z06 GT3.R", "gt3", 2024, "L", "Con la desaparición global de la especificación GTE al final de la temporada 2023, el Corvette C8.R de Chevrolet necesitaba un sucesor construido bajo especificación GT3. Entra el Z06 GT3.R, que además marcó el giro de la marca desde un programa oficial Corvette Racing hacia numerosos equipos de cliente, aunque el mismo grupo Pratt Miller Motorsports que lideró el esfuerzo oficial en GTE sigue siendo parte clave del proyecto. El Z06 GT3.R comparte mucho con el C8.R al que reemplaza, sobre todo el motor V8 de 5.5 litros basado en el LT6. El carro consiguió su primer podio en la clase GTD Pro del IMSA WeatherTech SportsCar Championship en Laguna Seca en la primavera de 2024, con Nicky Catsburg y Tommy Milner terminando terceros de clase. Seguramente vendrán más victorias y podios conforme el Z06 GT3.R construya sobre la extensa historia de éxito deportivo del Corvette."),
      c("Acura NSX GT3 EVO 22", "gt3", 2022, "L", "Construyendo sobre los éxitos del NSX GT3 original, que debutó en 2017 y ganó decenas de carreras y el campeonato IMSA GTD, el Acura NSX GT3 EVO 22 debutó en la temporada 2022 del IMSA WeatherTech SportsCar Championship. Terminó su temporada de estreno con bandera a cuadros en Petit Le Mans para Gradient Racing, que ya le había dado al EVO 22 su primer podio en IMSA en Long Beach ese mismo año, y sumó numerosas victorias y campeonatos en otras series del mundo. El NSX GT3 EVO 22 refinó la confiable plataforma de su antecesor con geometría de suspensión reajustada, intercoolers mejorados y revisiones en el sistema de ruedas, entre otras mejoras. En su corazón permanece el V6 biturbo de 3.5 litros de Acura, capaz de producir 520 caballos. Como otras máquinas GT3, cuenta con control de tracción, barras estabilizadoras y ajustes de alerón trasero regulables."),
      c("Aston Martin Vantage GT3 EVO", "gt3", 2024, "L", "Continuando una larga línea de deportivos producidos por el icónico fabricante británico, el Aston Martin Vantage GT3 salió a pista por primera vez en 2019. Su variante EVO se presentó en 2024, tanto como unidad nueva como kit de actualización para el carro original. Cuenta con una aerodinámica notablemente revisada —especialmente en la zona del morro— y suspensión mejorada respecto a su antecesor. Bajo el capó lo impulsa un V8 biturbo de 4.0 litros que puede producir hasta 600 caballos según el reglamento. Las victorias de los Vantage anteriores en Le Mans, Daytona y Spa dejaron la vara muy alta, pero el éxito ha continuado con el modelo GT3 EVO. Quizá su mayor triunfo temprano llegó en las 24 Horas de Spa de 2024, ganadas en la general por Comtoyou Racing por más de 30 segundos."),
      c("GT3 Legacy (BMW Z4 / Audi R8 / Ferrari 488 / Mercedes AMG 2015)", "gt3", 2015, "L", "El BMW Z4 GT3 reemplaza al BMW M3 que sirvió como plataforma para el considerable éxito de BMW Motorsport en la competencia IMSA y en el Campeonato FIA GT europeo. Aunque está basado en el popular roadster BMW Z4, el Z4 GT3 va equipado con un V8 de bloque de aluminio de 4.4 litros en lugar del seis en línea que se encuentra en la versión de calle. El Z4 GT3 presume un paquete aerodinámico sofisticado que incluye splitter delantero, aletines en los guardafangos delanteros, difusor trasero y alerón trasero de doble plano construido en plástico reforzado con fibra de carbono, mientras que bajo la carrocería el chasis cuenta con amortiguadores tipo McPherson sobre rodamientos de baja fricción, estabilizador tubular con láminas de ajuste al frente y suspensión de brazos tirados atrás."),

      // ---------- GT4 ----------
      c("Aston Martin Vantage GT4", "gt4", 2019, "L", "Aston Martin ha usado por mucho tiempo el Vantage como su entrada al automovilismo de especificación GT4, sometiendo al carro a múltiples revisiones y a décadas de historia deportiva. El GT4 de especificación actual debutó en las 24 Horas de Nürburgring de 2019, donde una unidad preparada de fábrica se llevó la victoria de la clase SP8T por cuatro vueltas de diferencia. Al año siguiente, KohR Motorsports le dio al Vantage GT4 su primer campeonato Grand Sport del IMSA Michelin Pilot Challenge, cuando los pilotos Kyle Marcelli y Nate Stacy barrieron el fin de semana en Mid-Ohio. Los Vantage GT4 siguen en uso en muchos de los mejores programas y eventos GT4 del mundo.", { w: "podium" }),
      c("BMW M4 GT4 (G82)", "gt4", 2023, "L", "Tras años de éxito sustancial de la plataforma M4 GT4 original, BMW lleva las cosas al siguiente nivel con el M4 G82 GT4. Debutando en la temporada 2023, la unidad actualizada tomó el relevo alrededor del mundo en series que van desde el IMSA Michelin Pilot Challenge hasta las carreras de resistencia en el Nürburgring Nordschleife. El motor turbo de 3.0 litros alcanza un impresionante máximo de 530 caballos, mientras que refinamientos adicionales prepararon al carro para construir sobre el legado trazado por su antecesor, el modelo F82. El M4 G82 GT4 se apoyó de inmediato en el impresionante legado del F82 con una victoria de clase en su primer intento en las 24h de Nürburgring, títulos en ambas series de IMSA con Turner Motorsport y mucho más.", { w: "podium" }),
      c("BMW M4 F82 GT4 (2018)", "gt4", 2018, "L", "La oferta de deportivo de cliente de BMW, el M4 GT4, no tardó mucho en dejar huella en el mundo del automovilismo en general. En su temporada de debut en 2018 fue nombrado \"Carro de Carreras del Año\" en los Professional MotorSport World Expo Awards, y respaldó el honor al año siguiente con títulos GT4 en el Blancpain GT World Challenge Asia y en las 24H SERIES, además de un título de equipos en el ADAC GT4 Germany. Ponte al volante de este GT4 deportivo y de respuesta viva y descubre de primera mano a qué se debe tanto ruido.", { w: "podium" }),
      c("McLaren 570S GT4", "gt4", 2017, "L", "Pocos fabricantes pueden igualar la emoción de manejar un McLaren en cualquier clase o especificación, y el 570S, la incursión de la legendaria marca en el mundo de los GT4, no es la excepción. Impulsada por un motor V8 biturbo de 3.8 litros y montada sobre el chasis MonoCell II de fibra de carbono de McLaren, esta máquina altamente ágil es el carro elegido por varios equipos de cliente que compiten en series de fórmula GT4 alrededor del mundo. El 570S GT4 se mostró por primera vez en el Goodwood Festival of Speed de 2016 e hizo su debut competitivo en el British GT bajo la supervisión de la propia marca ese mismo año, permitiendo que los clientes que recibieron sus unidades en 2017 manejaran un carro ya refinado en competencia real. Desde entonces ha demostrado ser muy popular, alcanzando una marca máxima de 140 podios globales en 2019.", { w: "podium" }),
      c("Mercedes-AMG GT4", "gt4", 2018, "L", "Comparado con su hermano mayor de la clase GT3, el Mercedes-AMG GT4 sigue dando un golpe potente. A pesar de llevar un motor V8 más pequeño de 4.0 litros, alineándolo con un Mercedes-AMG GT de calle, el carro todavía produce unos contundentes 544 caballos. También posee la mayoría de los elementos característicos que distinguen el diseño de Mercedes frente a sus competidores, desde un frontal largo y amenazante hasta una parrilla inconfundible que les avisa a los demás pilotos exactamente quién los viene siguiendo. En manos de los equipos Black Falcon y Schnitzelalm, el carro ha demostrado repetidamente su valía en las 24 Horas de Nürburgring, ganando la competitiva clase SP10 en sus dos primeros intentos y sumando una tercera victoria en 2021. También es una incorporación popular en el IMSA Michelin Pilot Challenge, donde Team TGM le dio su primer campeonato en 2018."),
      c("Porsche 718 Cayman GT4 Clubsport", "gt4", 2019, "L", "Pocos fabricantes de automóviles son tan venerados como Porsche, y muchos pilotos aprovecharán cualquier oportunidad que tengan para subirse al volante de uno de los vehículos icónicos de la marca. Entra el 718 Cayman GT4 Clubsport, que combina 425 caballos de rendimiento Porsche con la ágil y accesible plataforma GT4. El resultado es un deportivo muy popular que se corre en todo el mundo, desde campeonatos de una sola clase hasta el multiclase IMSA Michelin Pilot Challenge (donde tiene su casa en iRacing). Con una respuesta muy viva y una enorme dosis de diversión, es fácil ver por qué el 718 Cayman GT4 Clubsport también es popular como carro de track day.", { w: "podium" }),
      c("Ford Mustang GT4", "gt4", 2024, "L", "Presentado en el verano de 2023 para su uso de 2024 en adelante, el Ford Mustang GT4 actual se ha vuelto una opción popular en la categoría alrededor del mundo. Si su estilo inconfundiblemente americano no bastaba para convencer a los escépticos, sus resultados inmediatos sí lo hicieron: en su primer fin de semana de carrera, en la fecha inaugural del IMSA VP SportsCar Challenge en Daytona, Luca Mars de KohR Motorsports barrió ambas carreras camino a conseguir el título de clase ese mismo año. Como muchos otros fabricantes, Ford construyó el Mustang GT4 para uso de equipos de cliente, reservando sus esfuerzos oficiales para la división GT3 y superiores. Desarrollado en conjunto con Multimatic Motorsport, el Mustang GT4 presume un V8 Coyote de 5.0 litros construido por Ford Performance en Michigan. Otras características incluyen amortiguadores Multimatic DSSV, paneles de carrocería de fibra natural y un paquete aerodinámico específico de GT4."),

      // ---------- GTE ----------
      c("Ferrari 488 GTE", "gte", 2018, "L", "Con más de 100 victorias en su haber, incluyendo triunfos en las 12 Horas de Sebring y las 24 Horas de Le Mans, el Ferrari 458 GTE era el proverbial acto imposible de seguir. Pero el Ferrari 488 GTE estuvo más que a la altura, asegurando la Copa Mundial de Resistencia para Fabricantes de GT en su temporada de debut con victorias en Silverstone, Spa y Nürburgring, además de la 19ª edición de Petit Le Mans. Diseñado para aprovechar el nuevo reglamento aerodinámico de la FIA, más favorable a los motores centrales, el Ferrari 488 presumió un aumento del 50 % en carga aerodinámica frente a su antecesor gracias a un nuevo doble splitter delantero, un difusor soplado por el escape y generadores de vórtice en los bajos, todo con una resistencia al avance notablemente menor que la del 458. Sumado a un V8 biturbo de cuatro litros que produce unos 490 caballos y 650 Nm de torque, su forma funcional pero sensual lo convierte en uno de los GT de competencia más potentes del mundo."),
      c("Porsche 911 RSR", "gte", 2019, "L", "El primer Porsche 911 de motor central es el RSR, y cuenta con un motor atmosférico de 4.0 litros que produce 510 caballos. Construido específicamente para competir, el carro se corre en todo el mundo en la categoría LM-GTE en series que incluyen IMSA, el WEC y Le Mans. El 911 RSR es Porsche de pies a cabeza. Con sus rasgos de diseño agresivos y su silueta familiar, el motor bóxer de seis cilindros literalmente te grita cuando aceleras a la salida de las curvas. Con un peso de apenas 1.243 kilos, el RSR es un carro de carreras bien equilibrado, con frenos enormes que dan una capacidad de detención sin rival y una caja secuencial de seis velocidades de nuevo diseño que permite cambios fulminantes tanto al subir como al bajar."),
      c("Chevrolet Corvette C8.R", "gte", 2020, "L", "Con el cambio de Chevrolet a una configuración de motor central para el Corvette de octava generación, el programa de IMSA de la marca hizo el mismo giro para el WeatherTech SportsCar Championship de 2020. El Corvette C8.R construye sobre seis exitosos años de competencia de su antecesor, el C7.R, y debutó en las 24 Horas de Daytona de 2020. Seis meses después regresó a Daytona y ganó apenas en su segunda carrera con los pilotos Antonio García y Jordan Taylor, y una semana más tarde consiguió su primer 1-2 en Sebring International Raceway. La entrada más reciente en la extensa historia deportiva de Chevrolet cuenta con una planta motriz de 5.5 litros que produce 500 caballos a 7.400 rpm. Es el cuarto Corvette construido por Pratt & Miller desde su alianza con General Motors en 1999, una relación que ha traído ocho victorias en las 24 Horas de Le Mans, tres en las 24 Horas de Daytona y 11 en las 12 Horas de Sebring."),
      c("BMW M8 GTE", "gte", 2018, "L", "La bestia biturbo V8 de BMW se suma a la ya impresionante alineación de carros GTE en iRacing. Con más de 500 caballos, el carro de carreras insignia de BMW compite alrededor del mundo en series que incluyen el Campeonato Mundial de Resistencia de la FIA y el IMSA WeatherTech SportsCar Championship. Al ser un carro de motor delantero, el BMW ya se ha ganado la reputación de ser difícil de rebasar por su rendimiento y su tamaño. Los iRacers tendrán la oportunidad de correr el M8 rueda a rueda contra muchos otros carros GTE y descubrir por sí mismos cuál de ellos reinará supremo."),
      c("Ford GT (GTE)", "gte", 2017, "L", "Aunque siempre se pensó para ocupar un lugar entre los deportivos de ultra alto rendimiento más deseables del mundo, que no quede duda: el Ford GT de tercera generación fue concebido, diseñado y construido con una prioridad en mente, ganar las 24 Horas de Le Mans en el 50 aniversario de la mítica victoria de Ford en La Sarthe en 1966. El resultado es una obra maestra de diseño que evoca la forma icónica del Ford GT que Bruce McLaren y Chris Amon llevaron a la victoria en la \"ronde infernal\", aprovechando al máximo el reglamento de la FIA para crear otro ganador de Le Mans. Con un área frontal minúscula y unos dramáticos contrafuertes voladores, el Ford GT corta el aire en la recta de Mulsanne como el proverbial cuchillo en la mantequilla, con mucha ayuda de un V6 EcoBoost biturbo de 3.6 litros que produce 530 caballos y 670 Nm de torque. La combinación entregó una victoria dramática en Le Mans en 2016, en su campaña inaugural."),

      // ---------- GT1 / CLÁSICOS GT ----------
      c("Aston Martin DBR9 GT1", "gt1", 2005, "S", "El Aston Martin DBR9 rinde homenaje a David Brown, antiguo dueño de Aston Martin, cuyos DBR1 ganaron las 24 Horas de Le Mans y el Campeonato Mundial de Sport Prototipos en 1959. El DBR9 estuvo a la altura de su herencia ganando su debut competitivo en las 12 Horas de Sebring de 2005, antes de conseguir victorias consecutivas de la clase GT1 en Le Mans en 2007 y 2008 y lograr un éxito considerable en IMSA, la European Le Mans Series y el Campeonato FIA GT, tanto en manos del equipo oficial Aston Martin como de varios equipos privados. Basado en el Aston Martin DB9 de calle, el DBR9 conserva el chasis, el bloque del motor V12 y las culatas del DB9. El resto del carro está rediseñado para competencia de alto rendimiento, con jaula antivuelco de acero, transmisión secuencial XTRAC, paneles de carrocería de compuesto de carbono, fondo plano entre los difusores delantero y trasero y alerón trasero de fibra de carbono.", { notas: ["Cambio secuencial real de palanca: usa la Fanatec en modo secuencial."] }),
      c("Chevrolet Corvette C6.R GT1", "gt1", 2006, "S", "El nombre \"Corvette\" significa rendimiento en la calle y en la pista, pero no fue sino hasta que Chevrolet se alió con Pratt and Miller Engineering para diseñar, desarrollar y competir una versión de carreras del C5 que Corvette disfrutó del éxito en los niveles más altos del automovilismo deportivo internacional. Tras algunos dolores iniciales, el C5.R ganó la clase GT en las 24 Horas de Daytona y en Le Mans en 2001, y sumó tres victorias seguidas en Sebring, dos más en Le Mans y tres títulos consecutivos de IMSA GT1. Para 2005 el nuevo y mejorado Corvette C6 estaba listo, y el C6.R llegó poco después. Como su antecesor, usaba un V8 de 7.0 litros desarrollado por Katech. Con cárter seco, culatas trabajadas en CNC, válvulas y bielas de titanio y cigüeñal forjado de acero, el motor LS7R rendía oficialmente 590 caballos y 868 Nm de torque. Acoplado a un difusor trasero mejorado, un alerón más eficiente y un parachoques delantero revisado, el C6.R generaba la misma carga aerodinámica que el C5.R pero con 6 % menos de resistencia."),
      c("Ford GT-R (Legacy)", "gt1", 2009, "L", "El Ford GT-R es la versión del siglo XXI de uno de los deportivos más reconocibles y exitosos de la historia: el Ford GT40. Diseñado y construido por instrucción de Henry Ford II tras el fracaso de Ford en su intento de comprar Ferrari a principios de los 60, el Ford GT40 debutó en las 24 Horas de Le Mans en 1964. Después de un par de derrotas desgarradoras en Le Mans, el GT40 consiguió una victoria dramática allí en 1966, la primera de cuatro triunfos consecutivos de Ford en el clásico francés. Casi cuarenta años después, Ford recuperó la forma icónica del GT40 con una versión moderna del Ford GT que se vendió en cantidades limitadas en 2005 y 2006. Con su potente V8 de cinco litros en posición central, caja semiautomática de seis velocidades y aerodinámica actualizada, el Ford GT Mk VII fue una incorporación bienvenida y potencialmente competitiva a la categoría IMSA GT-2. Robertson Racing asumió el rol principal desarrollando y compitiendo el carro, rebautizado como Ford GT-R."),
      c("McLaren MP4-12C GT3", "gt3", 2012, "L", "Basado en el revolucionario McLaren MP4-12C de calle, el McLaren MP4-12C GT3 casa la tecnología de la Fórmula 1 con la innovación de los carros de calle para crear un deportivo de competencia de última generación. Usa el mismo chasis MonoCell de carbono que el 12C de calle, junto con su motor V8 biturbo M838T de 3.8 litros McLaren, aunque desafinado a 500 caballos conforme al reglamento de la FIA. El 12C GT3 lleva una caja Ricardo de seis velocidades y un paquete aerodinámico desarrollado en el simulador de Fórmula 1 de McLaren junto con la calibración de motor, la dirección asistida, la dureza de resortes, la distribución de pesos, las relaciones de cambio y los ajustes de diferencial. Debutó en competencia en el British GT Championship en Spa-Francorchamps en julio de 2012 y sumó 19 victorias por toda Europa esa misma temporada.", { s: "rojo" }),
      c("Audi 90 GTO", "clasico", 1989, "H", "El Audi 90 GTO abrasó un camino turboalimentado y con tracción total a través de la serie IMSA GTO de 1989, dejando una marca imborrable en la escena del automovilismo estadounidense. El Audi contaba con un chasis tubular de acero, suspensión de doble horquilla con resortes helicoidales, frenos de disco ventilados en las cuatro ruedas y, por supuesto, el característico sistema de tracción total Quattro de Audi. La potencia venía de un motor de cinco cilindros y 2.190 cc equipado con un turbocompresor KKK. Con Hans Stuck y el campeón de Trans-Am Hurley Haywood al mando, el Audi 90 GTO dominó la competencia IMSA GTO en 1989. Stuck ganó en Summit Point, Mid-Ohio, Topeka, Sears Point, Watkins Glen, Lime Rock y Laguna Seca, apoyado hábilmente por Haywood, que entregó un 1-2 de Audi en cinco ocasiones. Aunque el Audi 90 GTO no ganó un campeonato, logró algo mucho más raro: se ganó el corazón y la mente de toda una generación de aficionados.", { s: "rojo" }),

      // ---------- COPAS ----------
      c("Porsche 911 Cup (992.2)", "copa", 2026, "L", "Una de las plataformas monomarca de cliente más icónicas del mundo recibe una nueva evolución para 2026, cuando el Porsche 911 Cup (992.2) debuta en la Porsche Mobil 1 Supercup y en series Carrera Cup seleccionadas alrededor del mundo. Simplificar la experiencia es la prioridad del nuevo carro, que cuenta con aerodinámica mejorada, operación simplificada tanto al volante como en boxes, y un nombre nuevo. El 911 Cup (992.2) sigue usando un motor bóxer de seis cilindros atmosférico de 4.0 litros, que incorpora más componentes del Porsche 911 GT3 de calle pero sigue produciendo 512 caballos. Las mejoras de diseño en los parachoques delantero y trasero, el mayor rendimiento y vida útil de los frenos, y la posibilidad de hacer más ajustes en el carro lo convierten en la mejor entrada hasta la fecha del impresionante catálogo monomarca de Porsche.", { notas: ["Sin ABS: el resorte rojo ayuda a dosificar con presión, no con recorrido."] }),
      c("Porsche 911 GT3 Cup (991)", "copa", 2017, "L", "Corrido en más de 20 series alrededor del mundo, incluyendo el Porsche GT3 Cup Challenge USA y la Porsche Mobil 1 Supercup como soporte del Campeonato Mundial de Fórmula 1 de la FIA, el Porsche 911 GT3 Cup es el carro de carreras GT más producido y más utilizado del mundo. Como tal, ha sido el vehículo que lanzó las carreras profesionales de campeones como Sven Müller, Philipp Eng, Richard Westbrook, René Rast, Nicki Thiim, Earl Bamber y Jörg Bergmeister. Con su potente bóxer de seis cilindros de aluminio y 4 litros instalado en la parte trasera de su chasis de 1.200 kilos, el 911 GT3 Cup es un carro exigente de dominar, pero que entrega amplias recompensas a quienes lo logran. Su caja es una transmisión manual de garras semiautomática de seis velocidades accionada por levas, y entrega 485 caballos a 7.500 rpm.", { notas: ["Sin ABS: el resorte rojo ayuda a dosificar con presión, no con recorrido."] }),
      c("Porsche 911 Cup (992.1)", "copa", 2021, "L", "Novedad para la temporada 2021 de la Porsche Supercup, la generación más reciente del Porsche 911 GT3 Cup construye sobre un marco existente y exitoso para crear la siguiente era de carreras de primer nivel en la principal serie monomarca global de Porsche. Subiendo la potencia a 510 caballos en su planta motriz bóxer de seis cilindros y 4.0 litros, 25 más que su antecesor, el 911 GT3 Cup más reciente incorpora mejoras en la construcción del chasis, la aerodinámica, la suspensión y las características de seguridad, y puede correr con combustibles sintéticos por primera vez. ¿Tienes lo necesario para dominar la máquina y convertirte en el próximo gran campeón Porsche?", { notas: ["Sin ABS: el resorte rojo ayuda a dosificar con presión, no con recorrido."] }),
      c("Porsche Mission R", "copa", 2023, "N", "Una de las marcas más importantes de la industria automotriz da el paso hacia el futuro con el Porsche Mission R, el primer carro de carreras GT totalmente eléctrico de Porsche y el primer carro eléctrico en llegar a iRacing. Diseñado para igualar en rendimiento al consolidado Porsche 911 GT3 Cup, el Mission R es un adelanto de cómo se verá el futuro del automovilismo de cliente conforme la industria siga evolucionando con la electrificación. Generando más de 800 kilovatios de potencia desde sus dos motores eléctricos, el carro acelera de 0 a 100 km/h en menos de 2.5 segundos. Su capacidad de carga rápida le permite recuperar hasta el 75 % de la batería en apenas 15 minutos entre carreras. Y en quizá su innovación más relevante para el mundo del sim racing, la celda del piloto tipo monocasco del Mission R puede usarse fuera del carro como simulador.", { w: "gt3", notas: ["Eléctrico sin caja de cambios: no hay nada que cambiar, ni levas ni palanca."] }),
      c("Ferrari 296 Challenge", "copa", 2024, "L", "Por más de 30 años, el Ferrari Challenge ha sido una de las principales series monomarca del automovilismo mundial. Debutó en Europa en 1993, seguido por Norteamérica al año siguiente, y desde entonces ha sumado series regionales en el Reino Unido, Japón y Australasia. Desde 2013, todas las series del Ferrari Challenge se reúnen para una final global, las Finali Mondiali, que corren habitualmente en el circuito de Mugello, propiedad de Ferrari. En 2024, el Ferrari 296 tomó el relevo como carro oficial del Ferrari Challenge tras ocho años de servicio del 488 y el 488 EVO. El 296 es el noveno carro en la historia de la serie, pero el primero en usar un V6 a 120 grados; monta un motor biturbo de tres litros, el más potente en la historia de la categoría, igual que su contraparte GT3. El 296 Challenge también cuenta con una aerodinámica de vanguardia que produce la mayor carga en la historia de la serie y neumáticos Pirelli desarrollados especialmente."),
      c("Global Mazda MX-5 Cup", "copa", 2025, "S", "El Global Mazda MX-5 Cup encarna las características clásicas de deportivo descapotable que han convertido a las generaciones previas del MX-5 en verdaderos clásicos: una mezcla cautivadora de potencia, manejo ágil y confort en un paquete asequible. iRacing se enorgullece de haber contribuido al diseño y desarrollo del MX-5 que, como sus antecesores, se convirtió rápidamente en el carro de producción más corrido del mundo, con la MX-5 Cup en Norteamérica y series similares en Europa y Asia.", { w: "redondo", s: "azul", notas: ["Palanca Fanatec en modo secuencial: tirón seco sin embrague en marcha."] }),
      c("Mazda MX-5 Cup (legacy)", "copa", 2015, "H", "MX-5, Miata, Eunos Roadster... con cualquier nombre, el enormemente popular deportivo biplaza de Mazda ha figurado por mucho tiempo entre los automóviles más corridos del mundo. Columna vertebral de la Mazda MX-5 Cup de SCCA Pro Racing, y todavía una propuesta competitiva en carreras de club desde Lime Rock hasta Twin Ring Motegi o en autocross en estacionamientos de todo el planeta: donde encuentres competencia automovilística, encontrarás un Mazda MX-5. Es comprensible. El MX-5 ofrece un balance satisfactorio de potencia y agilidad, envuelto en una forma clásica y a un precio muy razonable. Nacido del deseo de Mazda de construir un deportivo ligero y mecánicamente sencillo, el primer MX-5 (conocido como Miata en Estados Unidos) salió a la venta en 1989. La versión Cup del carro tiene volante a la izquierda de serie, tal como corre en Norteamérica.", { w: "redondo", s: "azul" }),
      c("Toyota GR86 Cup", "copa", 2022, "L", "El carro oficial de la nueva Toyota GR Cup, la flamante serie monomarca de circuito de Toyota, el Toyota GR86 sirve como un vehículo accesible y deportivo para que los pilotos pulan su oficio. Anunciado en 2022, cada Toyota GR86 arranca como un vehículo totalmente de producción antes de dirigirse a Carolina del Norte, donde los ingenieros de Toyota Gazoo Racing North America lo transforman en una máquina de carreras capaz de enfrentar algunos de los mejores circuitos de Estados Unidos. La GR Cup está diseñada como una serie amateur que puede recibir por igual a pilotos en ascenso, manejadores casuales y leyendas retiradas, y el GR86 está a la altura. Modificaciones a la medida como una transmisión secuencial de seis velocidades y una carrocería nueva más agresiva elevan el perfil del carro de calle para las necesidades de la pista, sin volverse demasiado difícil de manejar demasiado pronto.", { s: "azul", w: "podium", notas: ["Secuencial SADEV con levas neumáticas, pero el embrague va en el pedal VRS: no necesitas levas de embrague."] }),
      c("BMW M2 CS Racing", "copa", 2020, "L", "El pedigrí moderno de BMW en competencia se extiende a todos los niveles de la escalera del automovilismo deportivo, no solo a los más altos. Su apoyo a los héroes del track day y a los amateurs en ascenso no es más evidente que en el M2 CSR, homologado para la clase TCX y compitiendo internacionalmente en su propia M2 CS Racing Cup. BMW Motorsport y BMW M colaboraron para diseñar el carro tras adaptar aprendizajes clave de la creación del M4 GT4 al automovilismo de acceso. Con un peso de 1.545 kilos y produciendo 365 caballos desde un motor de seis cilindros en línea de 3.0 litros en su variante Cup, el M2 CSR ofrece potencia de sobra para futuras estrellas que buscan algo que no llega a ser un GT4 pero que es más rápido que muchos otros vehículos de acceso. El carro también cuenta con jaula antivuelco totalmente aprobada por la FIA, alerón trasero y splitter delantero de competencia, y un sistema ABS especialmente calibrado.", { s: "azul", w: "podium" }),
      c("BMW M2 Racing (G87)", "copa", 2026, "L", "Construyendo sobre el éxito de múltiples generaciones de carros de acceso, incluido el M2 CS Racing que ya está en iRacing, el BMW M2 Racing (G87) entró en escena en 2026 como la iteración más reciente de BMW. Elegible para numerosas series monomarca y multimarca alrededor del mundo, el M2 Racing está construido para demostrar que la sofisticación técnica y la accesibilidad económica pueden coexistir. Presumiendo 313 caballos anunciados desde su motor biturbo de cuatro cilindros en línea, el M2 Racing puede alcanzar una velocidad máxima de 270 km/h. Otras evoluciones respecto al anterior M2 CS Racing incluyen amortiguadores basados en tecnología GT3 moderna y neumáticos Goodyear 265/660 R18.", { s: "azul", w: "podium" }),

      // ---------- TCR / TURISMOS ----------
      c("Renault Clio R.S. V Cup", "tcr", 2023, "L", "Los campeonatos monomarca de Renault han sido algunas de las series europeas de circuito más accesibles durante casi seis décadas. Originados en 1966 en Francia con el Gordini, el Clio de primera generación debutó en 1991, momento en el que la mayoría de los grandes países europeos tenía una serie propia. Tras una breve pausa, el Clio volvió a ser el modelo elegido a principios de los 2000 y ha sido el carro de Renault desde entonces. El Clio Cup de quinta generación debutó en 2020 y desde entonces ha sido adoptado por las cinco series Clio Cup activas en Europa. Impulsado por un motor Renault HR13, el carro pesa apenas 1.030 kilos con una distancia entre ejes de 2.579 mm, lo que lo hace rápido, ágil y divertido para pilotos de todos los niveles. Entre los campeones monomarca de Renault del pasado están la leyenda del WRC y el Dakar Carlos Sainz, el ganador de Le Mans Jan Lammers, el ícono de los turismos Jason Plato y el campeón de monoplazas y medallista de oro en X Games Kenny Bräck.", { notas: ["Cambio secuencial accionado por levas, como en el carro real de la Clio Cup."] }),
      c("Audi RS 3 LMS Gen2 TCR", "tcr", 2021, "L", "Debutando en 2021, la segunda generación del turismo Audi RS3 LMS construye sobre el éxito mundial del carro original. Tras su estreno en la Copa Mundial de Turismos de 2021, el carro obtuvo el galardón de Modelo TCR del Año durante tres años seguidos desde su lanzamiento, mientras los pilotos de Audi reclamaban múltiples campeonatos alrededor del mundo en cada temporada. El RS3 LMS de segunda generación ofrece una renovación visual basada en el RS3 de calle de cuarta generación, así como un diseño más ergonómico en la cabina. Igual que su antecesor, el motor es en su mayor parte de serie tal como sale de la línea de producción, lo que hace del éxito del RS3 LMS un testimonio de la fortaleza de los productos de consumo de la marca.", { w: "podium" }),
      c("Audi RS 3 LMS TCR (Gen1)", "tcr", 2017, "L", "El automovilismo de turismos ha explotado en popularidad alrededor del mundo en los últimos años, y el Audi RS 3 LMS ha demostrado ser uno de los carros más populares. Utilizado por pilotos en cuatro continentes, el RS 3 LMS encontró el éxito rápidamente tras su debut y fue votado \"Modelo del Año 2018\" entre vehículos de 12 fabricantes. Ligero y rápido, el Audi RS 3 LMS produce hasta 350 caballos desde su planta motriz turbo de dos litros. El cambio secuencial y un rápido tiempo de 0 a 96 km/h hacen que este turismo de tracción delantera produzca mucha acción emocionante, sin importar dónde ni cuándo corra.", { w: "podium" }),
      c("Honda Civic Type R TCR", "tcr", 2018, "L", "El automovilismo de turismos sigue siendo una de las formas más populares de competencia en circuito del mundo, combinando carros accesibles de tracción delantera con algunos de los trazados más legendarios del planeta. El resultado es una modalidad agresiva, a codazos, que resulta tan divertida para los pilotos al volante como para los aficionados en las gradas. El Honda Civic Type R debutó en 2018 y se llevó premios consecutivos de Modelo del Año a nivel global en 2019 y 2020. Presumiendo el mismo motor turbo de cuatro cilindros que el Civic Type R de calle, la versión de competencia entrega 340 caballos. Competido alrededor del mundo por diversos equipos, los aficionados norteamericanos quizá reconozcan mejor al Civic Type R por correr el IMSA Michelin Pilot Challenge con equipos como LA Honda World Racing y Atlanta Speedwerks."),
      c("Hyundai Elantra N TCR", "tcr", 2021, "L", "El automovilismo de turismos sigue siendo una de las formas más populares de competencia en circuito del mundo, combinando carros accesibles de tracción delantera con algunos de los trazados más legendarios del planeta. Introducido en septiembre de 2020, el Elantra N TC de Hyundai se convirtió en su oferta de turismo más reciente para equipos de cliente alrededor del mundo. Sucediendo a los turismos i30 y Veloster que habían debutado en temporadas previas, el Elantra mejora la tecnología existente de Hyundai con un motor turbo de dos litros completamente nuevo que produce 350 caballos. El carro debutó en el IMSA Michelin Pilot Challenge en 2021, con Bryan Herta Autosport compitiendo dos unidades."),
